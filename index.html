<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Bătălia de pe Lună</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: lupta 3D pe tot ecranul; capitolul cu versurile în stânga sus, punctele de vedere și cronologia jos. Un singur look, întunecat. */
  :root {
    --void: #050608;
    --ink: #f1e4cc;
    --ink-dim: #b0a088;
    --panel: rgba(12, 11, 12, 0.8);
    --line: rgba(241, 228, 204, 0.16);
    --gold: #d9b45a;      /* Titanul */
    --sum: #7fb2e6;       /* pământenii */
    --heat: #ff8a4a;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--void); color: var(--ink); overflow: hidden; font-family: var(--mono); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.flying { cursor: crosshair; }
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; transform: translate(-50%, -100%); font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase;
    white-space: nowrap; padding: 3px 6px 4px; border-bottom: 1px solid currentColor; color: var(--gold); text-shadow: 0 1px 3px #000; }
  .tag.sum { color: var(--sum); }
  .tag.dead { opacity: .45; text-decoration: line-through; }

  .chapter { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px));
    width: min(360px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .chapter summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .chapter summary::-webkit-details-marker { display: none; }
  .chapter summary:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .chapter h1 { margin: 0; font: 600 22px/1.05 var(--display); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
  .chapter h1 span { color: var(--heat); }
  .chapter summary small { font: 500 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
  .chapter[open] summary small::after { content: " ▴"; }
  .chapter:not([open]) summary small::after { content: " ▾"; }
  .ch-body { display: grid; gap: 10px; padding: 0 14px 14px; }
  .verse { margin: 0; font: italic 13px/1.55 var(--mono); white-space: pre-line; color: var(--ink); }
  .ref { margin: 0; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .what { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-dim); }

  .follow { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px));
    max-width: min(300px, calc(100vw - 32px)); padding: 9px 12px; background: var(--panel); border: 1px solid var(--line);
    font: 500 14px/1.25 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .follow b { color: var(--gold); font-weight: 600; }
  .follow small { display: block; font: 11px/1.4 var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-dim); margin-top: 3px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 8px;
    padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, rgba(5, 6, 8, .92), rgba(5, 6, 8, 0)); }
  .views { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .views::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); padding: 8px 11px; cursor: pointer; }
  .chip:hover { border-color: var(--ink-dim); }
  .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .chip.sum[aria-pressed="true"] { border-color: var(--sum); color: var(--sum); }
  .chip:focus-visible, .tl button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .tl { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; }
  .tl button { font: 600 14px/1 var(--display); letter-spacing: .08em; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    padding: 8px 10px; min-width: 40px; cursor: pointer; }
  .clock { font: 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-dim); min-width: 92px; }
  .track { position: relative; min-width: 0; height: 30px; }
  .track input { position: absolute; inset: 9px 0 auto; width: 100%; margin: 0; accent-color: var(--heat); }
  .ticks { position: absolute; inset: 0 0 auto; height: 8px; }
  .ticks button { position: absolute; top: 0; width: 9px; height: 9px; min-width: 0; padding: 0; transform: translateX(-50%) rotate(45deg);
    background: var(--ink-dim); border: 0; cursor: pointer; }
  .ticks button.on { background: var(--heat); }
  .hint { margin: 0; font-size: 10.5px; color: var(--ink-dim); text-align: center; }
  .pad { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); display: grid; gap: 8px; }
  .pad button { width: 52px; height: 52px; font: 600 18px/1 var(--display); color: var(--ink); background: var(--panel); border: 1px solid var(--line); touch-action: none; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 16px/1 var(--display);
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }
  @media (max-width: 640px) {
    .chapter h1 { font-size: 19px; }
    .verse { font-size: 12px; }
    .follow { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); right: auto; left: max(16px, env(safe-area-inset-left, 0px)); }
    .clock { min-width: 0; }
    .hint { display: none; }
  }
</style>

<div id="stage"></div>
<div id="tags"></div>
<div id="status">Se ridică Luna…</div>

<details class="chapter" id="chapter" open>
  <summary><h1 id="ch-title">Bătălia de pe Lună</h1><small id="ch-time">ep. 1</small></summary>
  <div class="ch-body">
    <p class="verse" id="ch-verse"></p>
    <p class="ref" id="ch-ref"></p>
    <p class="what" id="ch-what"></p>
  </div>
</details>
<div class="follow" id="follow" hidden></div>
<div class="pad" id="pad" hidden>
  <button type="button" id="p-fwd" aria-label="Înainte">▲</button>
  <button type="button" id="p-back" aria-label="Înapoi">▼</button>
</div>

<div class="bar">
  <div class="views" id="views"></div>
  <div class="tl">
    <button type="button" id="b-play" aria-label="Pauză">❚❚</button>
    <span class="clock" id="clock">0:00 / 5:30</span>
    <div class="track"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" max="330" step="0.1" value="0" aria-label="Momentul luptei"></div>
    <button type="button" id="b-speed" aria-label="Viteza">1×</button>
  </div>
  <p class="hint" id="hint">Clic pe orice navă ca s-o urmărești · trage ca să rotești · „Zbor liber”: W A S D, R / F sus-jos, Shift mai repede, rotița schimbă viteza</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---- mod-flota.js ----
// ---------- Flota de pe Titan: dreadnoughtul-cruce, crucișătorul, Lama ----------
// Aceeași geometrie ca în scripts/dreadnought3d/dreadnought.html (decisă de autor pe 24 oct.), scoasă în constructori,
// ca să pună lupta mai multe nave. Fără flacăra fuziunii (lângă Lună e oprită) și fără celulele din Brâu (închise).
// Unitatea e metrul. Axa navei e y: vârful sus. Originea grupului întors e mijlocul navei (y = 416 în coordonatele modelului).
function modFlota(ctx) {
  const { THREE, rng, canvasTex, glowTex, LAMA } = ctx;
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const UP = V3(0, 1, 0), ZA = V3(0, 0, 1);
  const CY = 416;

  function plumeTex(c0, c1) {   // fără repetare, altfel capătul se aprinde ca un inel
    const t = canvasTex(4, 512, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, c0); gr.addColorStop(0.18, c1); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    });
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    return t;
  }
  function winTex(seed, cols, lit, gy = 12) {   // ferestrele din miez: candele, nu neon
    const r = rng(seed);
    return canvasTex(1024, 256, (g, w, h) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
      for (let y = 4; y < h - 4; y += gy) for (let x = 2; x < w - 8; x += 10) {
        if (r() > lit) continue;
        g.globalAlpha = 0.5 + r() * 0.5;
        g.fillStyle = cols[(r() * cols.length) | 0];
        g.fillRect(x, y, 6, 4);
      }
    });
  }
  const radTex = canvasTex(256, 64, (g, w, h) => {
    g.fillStyle = '#1e0302'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 8) {
      g.fillStyle = `rgba(200, ${30 + (x * 7) % 30}, 14, ${0.35 + ((x * 13) % 30) / 100})`;
      g.fillRect(x + 2, 3, 4, h - 6);
    }
    g.fillStyle = '#a8441a'; g.fillRect(0, 0, w, 3); g.fillRect(0, h - 3, w, 3);
  });

  // materiale: negru mat și aur, ca la Lama
  const M = {
    hull: new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.8, metalness: 0.25 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x0f0e11, roughness: 0.7, metalness: 0.35 }),
    steel: new THREE.MeshStandardMaterial({ color: 0x26282c, roughness: 0.6, metalness: 0.45 }),
    shelf: new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.6, metalness: 0.45 }),
    gold: new THREE.MeshStandardMaterial({ color: 0xc9a04a, roughness: 0.32, metalness: 0.55, emissive: 0x3a2808, emissiveIntensity: 0.8 }),
    rim: new THREE.MeshStandardMaterial({ color: 0x8a6a2a, roughness: 0.4, metalness: 0.5, emissive: 0x8a6420, emissiveIntensity: 1.2 }),
    copper: new THREE.MeshStandardMaterial({ color: 0xa8673a, roughness: 0.4, metalness: 0.55, emissive: 0x2a1004 }),
    tank: new THREE.MeshStandardMaterial({ color: 0x1c1b1f, roughness: 0.75, metalness: 0.3 }),
    nozzle: new THREE.MeshStandardMaterial({ color: 0x2a2b2f, roughness: 0.5, metalness: 0.5, side: THREE.DoubleSide }),
    ice: new THREE.MeshStandardMaterial({ color: 0x5f7584, roughness: 0.32, metalness: 0, emissive: 0x0e1c26, emissiveIntensity: 0.6, flatShading: true, side: THREE.DoubleSide }),
    rad: new THREE.MeshStandardMaterial({ color: 0x120605, roughness: 0.7, metalness: 0.2, emissive: 0x6e0c05, emissiveMap: radTex, emissiveIntensity: 1 }),
    plasma: new THREE.MeshBasicMaterial({ color: 0xffd8a0 }),
    lampWarm: new THREE.MeshBasicMaterial({ color: 0xffc98a }),
    gun: new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.45, metalness: 0.55 }),
    sign: new THREE.MeshStandardMaterial({ color: 0xc9a04a, roughness: 0.3, metalness: 0.55, emissive: 0xffc860, emissiveIntensity: 0.25 }),
    greeb: new THREE.MeshStandardMaterial({ color: 0x151418, roughness: 0.75, metalness: 0.3 }),
  };
  const coreMat = tex => new THREE.MeshStandardMaterial({ color: 0x17161b, roughness: 0.6, metalness: 0.4, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 1.1 });
  const frunteMat = coreMat(winTex(3, ['#ffcf8a', '#ffe2b0', '#ffd9a8'], 0.4));
  const capelaMat = coreMat(winTex(11, ['#ffcf8a', '#ffe2b0'], 0.55, 16));
  const manPlumeMat = new THREE.MeshBasicMaterial({ map: plumeTex('rgba(240,244,255,1)', 'rgba(110,150,255,.6)'), transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const radial = phi => V3(Math.cos(phi), 0, -Math.sin(phi));

  function tools(parent) {
    const mesh = (geo, mat, x = 0, y = 0, z = 0, p = parent) => {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      p.add(m);
      return m;
    };
    const ring = (r, tube, y, mat, p = parent) => {
      const m = mesh(new THREE.TorusGeometry(r, tube, 8, 96), mat, 0, y, 0, p);
      m.rotation.x = Math.PI / 2;
      return m;
    };
    const cyl = (rt, rb, h, y, mat, seg = 64, open = false) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat, 0, y, 0);
    const bars = [];
    const bar = (a, b, t) => {
      const d = new THREE.Vector3().subVectors(b, a), len = d.length();
      const q = new THREE.Quaternion().setFromUnitVectors(UP, d.normalize());
      bars.push(new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(0.5), q, V3(t, len, t)));
    };
    const instanced = (geo, mat, mats, p = parent) => {
      const im = new THREE.InstancedMesh(geo, mat, Math.max(1, mats.length));
      mats.forEach((m, i) => im.setMatrixAt(i, m));
      im.count = mats.length;
      p.add(im);
      return im;
    };
    return { mesh, ring, cyl, bars, bar, instanced };
  }

  // ---------- crucișătorul: 253 m, 5 turele duble, 3 motoare ----------
  // Local, exteriorul (spatele turnului de comandă) e +z; fața dinspre dreadnought e -z. Originea: mijlocul corpului.
  const CRY = 418;
  function makeCruiser(seed) {
    const root = new THREE.Group();
    const g = new THREE.Group();
    g.position.y = -CRY;
    root.add(g);
    const { mesh, instanced } = tools(g);
    const HEX = Math.PI / 6;
    const hex = (rt, rb, y0, y1, mat) => mesh(new THREE.CylinderGeometry(rt, rb, y1 - y0, 6, 1, false, HEX), mat, 0, (y0 + y1) / 2, 0);
    hex(11, 15, 318, 340, M.dark);
    hex(15, 15, 340, 470, M.hull);
    hex(15.8, 15.8, 352, 368, M.gun);
    hex(15.8, 15.8, 420, 436, M.gun);
    hex(15.3, 15.3, 380, 380.8, M.gold);
    hex(15.3, 15.3, 455, 455.8, M.gold);
    hex(11, 15, 470, 500, M.hull);
    hex(1.2, 11, 500, 545, M.hull).scale.set(0.42, 1, 1.25);
    const gb = [], rr = rng(seed), ap = 15 * Math.cos(Math.PI / 6);
    for (let i = 0; i < 160; i++) {
      const th = ((rr() * 6) | 0) * Math.PI / 3, y = 342 + rr() * 126, dd = 0.3 + rr() * 0.8;
      const n = V3(Math.sin(th), 0, Math.cos(th)), tg = V3(Math.cos(th), 0, -Math.sin(th));
      const pp = n.clone().multiplyScalar(ap + dd / 2).addScaledVector(tg, (rr() - 0.5) * 11).setY(y);
      gb.push(new THREE.Matrix4().compose(pp, new THREE.Quaternion().setFromAxisAngle(UP, th), V3(1 + rr() * 5, 1 + rr() * 9, dd)));
    }
    instanced(unitBox, M.greeb, gb);
    mesh(new THREE.BoxGeometry(10, 40, 9), M.hull, 0, 405, ap + 4.5);
    mesh(new THREE.BoxGeometry(18, 9, 14), M.hull, 0, 428, ap + 9);
    mesh(new THREE.BoxGeometry(16, 1.2, 0.3), M.lampWarm, 0, 429, ap + 16.1);
    const muzzles = [];
    [[0, 445], [Math.PI / 3, 385], [-Math.PI / 3, 385], [Math.PI / 3, 458], [-Math.PI / 3, 458]].forEach(([th, y]) => {
      const n = V3(Math.sin(th), 0, Math.cos(th)), tg = V3(Math.cos(th), 0, -Math.sin(th));
      const b = mesh(new THREE.BoxGeometry(8, 6, 5), M.gun);
      b.position.copy(n).multiplyScalar(ap + 2.5).setY(y);
      b.rotation.y = th;
      [-1.8, 1.8].forEach(o => {
        const pp = n.clone().multiplyScalar(ap + 3).addScaledVector(tg, o).setY(y + 11);
        mesh(new THREE.CylinderGeometry(0.8, 0.8, 18, 10), M.gun, pp.x, pp.y, pp.z);
        muzzles.push(pp.clone().setY(y + 20 - CRY));
      });
    });
    const plumes = [];
    [0, 2, 4].forEach(k => {
      const th = k * Math.PI / 3, n = V3(Math.sin(th), 0, Math.cos(th)), c = n.clone().multiplyScalar(27);
      mesh(new THREE.CylinderGeometry(5.5, 6.5, 52, 8), M.hull, c.x, 326, c.z).rotation.y = th;
      mesh(new THREE.LatheGeometry([[7.5, 292], [6.5, 297], [5, 300]].map(([q, y]) => new THREE.Vector2(q, y)), 24), M.nozzle, c.x, 0, c.z);
      mesh(new THREE.TorusGeometry(4.6, 0.6, 8, 32), M.plasma, c.x, 298, c.z).rotation.x = Math.PI / 2;
      [[350, 336], [330, 318]].forEach(([y0, y1]) => {
        const a = n.clone().multiplyScalar(12).setY(y0), b = c.clone().setY(y1), v = new THREE.Vector3().subVectors(b, a);
        const m = mesh(new THREE.BoxGeometry(3.5, v.length(), 8), M.dark);
        m.position.copy(a).add(b).multiplyScalar(0.5);
        m.quaternion.setFromUnitVectors(UP, v.normalize());
      });
      const pl = mesh(new THREE.CylinderGeometry(5, 16, 90, 20, 1, true), manPlumeMat, c.x, 292 - 45, c.z);
      pl.rotation.x = Math.PI;
      plumes.push(pl);
    });
    [380, 450].forEach(y => mesh(new THREE.BoxGeometry(12, 12, 3), M.steel, 0, y, -(ap + 1.5)));
    root.userData = { len: 253, muzzles, plumes };
    return root;
  }

  // ---------- Lama: decodată din geometria simplificată (TRELLIS.2), 25 m, botul spre +x, burta spre -y ----------
  const lamaGeo = (() => {
    const b64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
    const q = new Uint16Array(b64(LAMA.pos)), col = new Uint8Array(b64(LAMA.col)), idx = new Uint16Array(b64(LAMA.idx));
    const lo = LAMA.bmin, hi = LAMA.bmax, s = 25 / (hi[0] - lo[0]);
    const P = new Float32Array(LAMA.n * 3), Cl = new Float32Array(LAMA.n * 3);
    for (let i = 0; i < LAMA.n; i++) for (let a = 0; a < 3; a++) {
      P[i * 3 + a] = (lo[a] + q[i * 3 + a] / 65535 * (hi[a] - lo[a]) - (lo[a] + hi[a]) / 2) * s;
      Cl[i * 3 + a] = 0.09 + Math.pow(col[i * 3 + a] / 255, 2.2) * 1.6;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P, 3));
    g.setAttribute('color', new THREE.BufferAttribute(Cl, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    return g;
  })();
  const lamaMat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.5, metalness: 0.35 });
  // Apariția Lamei: crucea de lumină pe burtă
  const crossTex = canvasTex(256, 256, (g, w) => {
    g.translate(w / 2, w / 2);
    g.rotate(Math.PI / 2);
    g.shadowColor = 'rgba(255,214,140,1)'; g.shadowBlur = 22; g.fillStyle = 'rgba(255,248,226,1)';
    g.fillRect(-6, -100, 12, 200);
    g.fillRect(-62, -46, 124, 12);
    g.fillRect(-30, -78, 60, 10);
    g.save(); g.translate(0, 56); g.rotate(-0.35); g.fillRect(-42, -5, 84, 10); g.restore();
  });
  const crossGeo = new THREE.PlaneGeometry(30, 30); crossGeo.rotateX(Math.PI / 2); crossGeo.translate(0, -2.9, 0);
  const crossMat = new THREE.MeshBasicMaterial({ map: crossTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

  // ---------- dreadnoughtul ----------
  // Întoarce { group, docks, muzzle, silos, cruiserMounts, manPlumes }. docks: unde atârnă cele 144 de Lame (în coordonatele grupului).
  function makeDreadnought(seed) {
    const rnd = rng(seed);
    const pivot = new THREE.Group();
    const ship = new THREE.Group();
    ship.position.y = -CY;
    pivot.add(ship);
    const { mesh, ring, cyl, bars, bar, instanced } = tools(ship);

    // coloana de zăbrele
    {
      const corners = [[9, 9], [-9, 9], [-9, -9], [9, -9]];
      corners.forEach(([x, z]) => bar(V3(x, 140, z), V3(x, 700, z), 2.2));
      for (let y = 140; y < 700; y += 20) for (let i = 0; i < 4; i++) {
        const [x1, z1] = corners[i], [x2, z2] = corners[(i + 1) % 4];
        bar(V3(x1, y, z1), V3(x2, y, z2), 1.2);
        bar(V3(x1, y, z1), V3(x2, y + 20, z2), 0.8);
      }
    }

<script>
// ---- ../baza3d/mod-unelte.js ----
// ---------- Unelte comune pentru modulele bazei (scripts/baza3d/PLAN.md) ----------
// Geometrie (merge, box, room, worldUV), culori pe vârfuri (paint, bakeShade), zgomot, texturi comune, flota instanțiată
// și navele de rezervă (cutii), ca modulele să se poată testa înainte de mod-nave.js.
function modUnelte(ctx) {
  const { THREE, canvasTex, rng, hashN } = ctx;
  const PI = Math.PI;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  // ---------- geometrie ----------
  // Lipește geometrii într-una singură. Ține position, normal, uv și color (unde lipsește culoarea, pune alb).
  function merge(geos) {
    geos = geos.filter(Boolean).map(g => (g.index ? g : g));
    let n = 0, ni = 0;
    const anyCol = geos.some(g => g.attributes.color);
    geos.forEach(g => { n += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; });
    const P = new Float32Array(n * 3), N = new Float32Array(n * 3), UV = new Float32Array(n * 2), C = anyCol ? new Float32Array(n * 3) : null;
    const I = n > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
    let o = 0, oi = 0;
    geos.forEach(g => {
      const c = g.attributes.position.count;
      P.set(g.attributes.position.array, o * 3);
      if (g.attributes.normal) N.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) UV.set(g.attributes.uv.array, o * 2);
      if (C) { if (g.attributes.color) C.set(g.attributes.color.array, o * 3); else C.fill(1, o * 3, (o + c) * 3); }
      if (g.index) for (let i = 0; i < g.index.count; i++) I[oi++] = g.index.array[i] + o;
      else for (let i = 0; i < c; i++) I[oi++] = o + i;
      o += c;
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(UV, 2));
    if (C) g.setAttribute('color', new THREE.BufferAttribute(C, 3));
    g.setIndex(new THREE.BufferAttribute(I, 1));
    return g;
  }
  const box = (x0, x1, y0, y1, z0, z1) => new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0).translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  // încăpere văzută din interior (normalele spre înăuntru): podea, tavan, pereții laterali, fundul; fără peretele din față (z1)
  function room(x0, x1, y0, y1, z0, z1, step = 5, front = false) {
    const w = x1 - x0, h = y1 - y0, d = z1 - z0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, cz = (z0 + z1) / 2;
    const sw = Math.max(1, Math.ceil(w / step)), sh = Math.max(1, Math.ceil(h / step)), sd = Math.max(1, Math.ceil(d / step));

      new THREE.PlaneGeometry(d, h, sd, sh).rotateY(PI / 2).translate(x0, cy, cz),
      new THREE.PlaneGeometry(d, h, sd, sh).rotateY(-PI / 2).translate(x1, cy, cz),
      new THREE.PlaneGeometry(w, h, sw, sh).translate(cx, cy, z0),

    for (let i = 0; i < 14; i++) { const k = 130 + R0() * 40; g.fillStyle = `rgba(${k},${k},${k - 6},.35)`; g.fillRect((R0() * 4 | 0) * 128, (R0() * 8 | 0) * 64, 128, 64); }

          ribs.forEach(s => {
            if (polySize(s.p) < 0.3) return;
            const p = scalePoly(s.p, 0.97);
            for (let j = 0; j < p.length; j++) { const q = p[(j + 1) % p.length]; fr.push(strut([p[j][0], p[j][1], s.z], [q[0], q[1], s.z], t)); }
          });
          for (let i = 0; i < secs.length - 1; i++) {
            const A = scalePoly(secs[i].p, 0.97), B = scalePoly(secs[i + 1].p, 0.97);
            for (let j = 0; j < A.length; j++) fr.push(strut([A[j][0], A[j][1], secs[i].z], [B[j][0], B[j][1], secs[i + 1].z], t));
          }
          return merge(fr);
        };
        const innerFn = () => loftGeo(secs.map(s => ({ z: s.z, p: scalePoly(s.p, 0.55) })), true, true);
        return add(g, c, o.tag || 'skin', { frameFn, innerFn });
      },
      // corpul întreg: secțiunile date, tăiat în plăci la z-urile din cuts; întoarce secțiunile (pentru geamuri și dungi)
      hull(type, list, cuts, c, o = {}) {
        const secs = S(type, list), segs = cut(secs, cuts);
        segs.forEach((sg, i) => b.loft(sg, c, i === 0 && o.capS !== false, i === segs.length - 1 && o.capE !== false, o));
        secs.type = type;
        return secs;
      },
      sphere(r, x, y, z, c, ws = 18, hs = 12, o = {}) {
        const frameFn = () => {
          const t = Math.max(0.06, r * 0.04), f = [];
          [-0.6, 0, 0.6].forEach(lat => f.push(new THREE.TorusGeometry(r * Math.cos(lat) * 0.98, t, 3, 20).rotateX(PI / 2).translate(x, y + r * Math.sin(lat) * 0.98, z)));
          for (let k = 0; k < 4; k++) f.push(new THREE.TorusGeometry(r * 0.98, t, 3, 20).rotateY(k * PI / 4).translate(x, y, z));
          return merge(f);
        };
        return add(sph(r, x, y, z, ws, hs), c, o.tag || 'skin', { frameFn, innerFn: () => sph(r * 0.55, x, y, z, 8, 6) });
      },
      // trenul de aterizare: picior înclinat puțin în afară și talpă; yb = fundul corpului, h = cât coboară
      legs(list, yb, h, pad = 0.5, t = 0.22) {
        list.forEach(([x, z]) => {
          const y0 = yb - h;
          add(strut([x * 0.75, yb + Math.min(0.6, h * 0.3), z], [x, y0 + 0.3, z], t), pal.dark, 'core');
          add(new THREE.CylinderGeometry(pad, pad * 1.15, 0.3, 10).translate(x, y0 + 0.15, z), pal.dark, 'core');

      },
      band: (r, z, w, c, seg = 24) => add(cylZ(r, r, w, seg, true).translate(0, 0, z), c, 'detail'),
      bandLoft(secs, z0, z1, c, k = 1.012) { add(loftGeo([z0, z1].map(z => ({ z, p: scalePoly(secAt(secs, z).p, k) })), false, false), c, 'detail'); },
      // tricolorul ca trei dungi în jurul corpului, de la z0 spre bot: roșu, galben, albastru
      tri3Loft(secs, z0, w) { [U.COL.red, U.COL.yellow, U.COL.blue].forEach((c, i) => b.bandLoft(secs, z0 + i * w, z0 + (i + 1) * w, c)); },
      tri3Cyl(r, z0, w) { [U.COL.red, U.COL.yellow, U.COL.blue].forEach((c, i) => b.band(r, z0 + (i + 0.5) * w, w, c)); },
      flag: (w, h, th, x, y, z) => add(flagGeo(w, h, th).translate(x, y, z), null, 'detail'),
      flagOn: (tf, w, h, th, x, y, z) => add(tf(flagGeo(w, h, th).translate(x, y, z)), null, 'detail'),
      // geamuri: fâșii pe fețele laterale de sus ale corpului fațetat
      winStrip(secs, z0, z1, n, gap, c = pal.win, edges = UP[secs.type]) { glows.push(paint(stripGeo(secs, z0, z1, n, gap, edges), c)); },
      stripe(secs, z0, z1, c, edges = UP[secs.type]) { add(stripGeo(secs, z0, z1, 1, 0, edges, 1.008), c, 'detail'); },
      // geamuri pe un corp rotund: unghiurile de la vârf (+y) spre +x
      winRing(r, z, angles, w, h, c = pal.win) { angles.forEach(a => glows.push(paint(new THREE.BoxGeometry(w, 0.08, h).translate(0, r, 0).rotateZ(-a).translate(0, 0, z), c))); },

      id: d.id, cls: d.cls, gen: d.gen, nume: d.nume,
      len: bb.max.z - bb.min.z, wid: bb.max.x - bb.min.x, hei: bb.max.y - bb.min.y,
      geo, glow, nozzles, tris: geo.index.count / 3,
    };
    out.variants = { desfacut: { geo: variant(d, pal, parts, 'desfacut', tx, ty, tz) }, epava: { geo: variant(d, pal, parts, 'epava', tx, ty, tz) } };
    return out;
  }

  // ---------- variantele pentru hangarul de reparații ----------
  function variant(d, pal, parts, state, tx, ty, tz) {
    const r = rng(hashStr(d.id + state));
    const skins = parts.map((p, i) => (p.tag === 'skin' && p.frameFn ? i : -1)).filter(i => i >= 0);
    const rm = new Set(skins.filter(() => r() < (state === 'desfacut' ? 0.5 : 0.35)));
    if (!rm.size && skins.length) rm.add(skins[(r() * skins.length) | 0]);
    const out = [];
    const opened = p => {   // placa scoasă: rămân ramele și, dedesubt, miezul (rezervoare, aparatură)
      const f = p.frameFn(), inn = p.innerFn();
      if (f) out.push(paint(f.scale(d.sc, d.sc, d.sc).translate(tx, ty, tz), state === 'epava' ? CHAR : pal.metal));
      if (inn) out.push(paint(inn.scale(d.sc, d.sc, d.sc).translate(tx, ty, tz), state === 'epava' ? 0x1c1a18 : pal.dark));
    };
    parts.forEach((p, i) => {
      if (rm.has(i)) { opened(p); return; }
      if (state === 'desfacut') {
        if (p.tag === 'engine') return;                         // motoarele sunt scoase
        if (p.tag === 'detail' && r() < 0.3) return;
        out.push(p.tag === 'skin' && r() < 0.3 ? paint(p.geo.clone(), PRIMER) : p.geo);   // plăci noi, doar grunduite
      } else {
        if (p.tag === 'engine' && r() < 0.6) return;
        if (p.tag === 'detail' && r() < 0.5) return;
        out.push((p.tag === 'detail' || p.tag === 'engine') && r() < 0.3 ? breakPart(p.geo, r) : p.geo);
      }
    });
    const g = merge(out);
    if (state === 'epava') soot(g, (hashStr(d.id) % 97) + 0.5);
    return g;
  }
  // o piesă ruptă: strâmbă și lăsată mai jos
  function breakPart(geo, r) {
    const g = geo.clone();
    g.computeBoundingBox();
    const c = g.boundingBox.getCenter(V(0, 0, 0)), s = g.boundingBox.getSize(V(0, 0, 0));
    g.translate(-c.x, -c.y, -c.z);
    g.rotateX((r() - 0.5) * 0.7); g.rotateZ((r() - 0.5) * 0.7);
    g.translate(c.x + (r() - 0.5) * s.x * 0.2, c.y - r() * Math.min(1.5, s.y * 0.4), c.z + (r() - 0.5) * s.z * 0.1);
    return g;
  }
  // funingine: pete întunecate, arse
  function soot(g, seed) {
    const p = g.attributes.position, c = g.attributes.color;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const n = U.vn(x / 2.5 + seed, z / 2.5 + y / 3), k = 0.1 + 0.42 * n * n + 0.1 * U.vn(z / 9, x / 9 + seed);
      c.setXYZ(i, c.getX(i) * k * 1.04, c.getY(i) * k * 0.96, c.getZ(i) * k * 0.88);
    }
    c.needsUpdate = true;
    return g;
  }

  {

    // tunelul de serviciu, sub rocă: intră drept în stâncă, coboară cotind și iese drept în vestibulul din peretele din față
    // al sălii (mod-sala: la x = ±1100, podeaua la -300, ușa la z = -300); secțiunea e cât vestibulul, 64 × 34 m
    const W2 = (GATE.x1 - GATE.x0 - 6) / 2, H2 = GATE.h - 6, xc = side * (GATE.x0 + GATE.x1) / 2;

      rings.push([p.clone().sub(s), p.clone().add(s), p.clone().add(s).setY(p.y + H2), p.clone().sub(s).setY(p.y + H2)]);
    }
    for (let i = 0; i < n; i++) for (let j = 0; j < 4; j++) {

    if (nf.y < 0) for (let k = 0; k < pos.length; k += 3) { const x = pos[k + 1]; pos[k + 1] = pos[k + 2]; pos[k + 2] = x; }

  // Fiecare tunel: podeaua și tavanul trec prin marginile gurii (y = 30 și 74) la z = -100 și coboară paralel la 30°.
  {
    const walls = [], rails = [], coils = [], lights = [];
    const tan = Math.tan(PI / 6), zEnd = -350, dz = BZ0 - zEnd;
    PX.forEach(x => {
      const x0 = x - PORT.w / 2, x1 = x + PORT.w / 2;
      const f0 = PORT.y0, f1 = PORT.y0 - dz * tan, c0 = PORT.y1, c1 = PORT.y1 - dz * tan;
      const quad = (a, b, c, d) => {   // a-b-c-d în ordine, fața spre interior

      }
    });
    const tg = U.worldUV(U.merge(walls), 24);
    inn.add(new THREE.Mesh(tg, M.tube));
    inn.add(new THREE.Mesh(U.merge(rails), M.rail));
    inn.add(new THREE.Mesh(U.merge(coils), M.coil));
    inn.add(new THREE.Mesh(U.merge(lights), M.lamp));
  }

  // ---------- postul de control al porții (sub rocă, în spatele geamului) ----------
  {
    const R = { x0: WIN.x0 - 6, x1: WIN.x1 + 6, y0: WIN.y0 - 4, y1: WIN.y1 + 8, z0: BZ0 - 34, z1: BZ0 };

  // împrăștie în stol, spre soare, ca liliecii (r. 629-632). Navele zboară în sceneOut (lumina Soarelui), și prin tunel.
  const LAUNCH = (() => {
    const kinds = ['vanator', 'racheta', 'naveta', 'vanator', 'remorcher', 'racheta'];
    const picks = kinds.map((k, i) => ctx.nave.pick(k, 3, ctx.rng(900 + i))).filter(d => d.len <= 42 && d.wid <= 40);

    const tExit = (-V0 + Math.sqrt(V0 * V0 + 2 * ACC * s0)) / ACC, vExit = V0 + ACC * tExit;

      ims.forEach(o => { o.im.count = 0; if (o.gm) o.gm.count = 0; });

      for (let tube = 0; tube < PX.length; tube++) {
        const phase = tube * 0.29;
        const nMax = Math.floor((t - phase) / PER);
        for (let n = Math.max(0, nMax - SLOTS + 1); n <= nMax; n++) {

          _m.compose(_p, _q, ONE);
          o.im.setMatrixAt(o.im.count++, _m);
          if (o.gm) o.gm.setMatrixAt(o.gm.count++, _m);
        }
      }
      ims.forEach(o => { o.im.instanceMatrix.needsUpdate = true; if (o.gm) o.gm.instanceMatrix.needsUpdate = true; });
    }

  })();

  // camera e într-un tunel al catapultelor sau în postul de control: atunci se desenează și sala
  const UPT = V(0, Math.cos(PI / 6), -Math.sin(PI / 6));
  function inside(p) {

    mesh(gab(true), M.rock);
    mesh(gab(false), M.rock);
    Object.entries(WALLS).forEach(([wk, w]) => {   // banda de rocă -60..-50
      const o = wpt(w, w.t0, CT, 0), r = w.T.clone().multiplyScalar(w.t1 - w.t0), u = V(0, WT - CT, 0);

  }

  // ---------- orașul: fațadele pereților, cu golurile tunelurilor și al peretelui catapultelor ----------
  const streetLights = [], STREET = [hexRGB(0xffb362), hexRGB(0xe8f0ff)];
  {
    Object.entries(WALLS).forEach(([wk, w]) => {
      // tăieturile: gurile tunelurilor (fațada rămâne doar deasupra lor) și peretele catapultelor din față
      const cuts = MOUTHS.filter(m => m.wk === wk).map(m => ({ a: m.t - m.w / 2, b: m.t + m.w / 2, y0: FL + m.h + 2 }));
      if (wk === 'F') cuts.push({ a: -262, b: 262, y0: null });
      cuts.sort((p, q) => p.a - q.a);
      // segmente de ~200-420 m, fiecare cu stilul și varianta lui; lângă granițele vârstelor, petice din vârsta vecină
      const marks = [w.t0];
      for (let t = w.t0; t < w.t1;) { t += rr(90, 280); if (t < w.t1 - 40) marks.push(t); else break; }
      marks.push(w.t1);
      cuts.forEach(cu => { marks.push(cu.a, cu.b); });
      const ts = [...new Set(marks)].sort((a, b) => a - b);
      const rockQ = (t0, t1, y0, y1, k) => rockBatch.quad(wpt(w, t0, y0, 0.05), w.T.clone().multiplyScalar(t1 - t0), V(0, y1 - y0, 0),
        [[t0 / 110, y0 / 110], [t1 / 110, y0 / 110], [t1 / 110, y1 / 110], [t0 / 110, y1 / 110]], [k, k * 0.97, k * 0.93]);
      for (let i = 0; i < ts.length - 1; i++) {
        let a = ts[i];
        const b = ts[i + 1], mid = (a + b) / 2;
        if (b - a < 0.5) continue;
        const cut = cuts.find(cu => mid > cu.a && mid < cu.b);
        if (cut && cut.y0 === null) continue;

        // între clădiri, pe unele locuri, roca rămasă între săpături

        const ys = [y0];

        ys.push(CT);

        const zMid = w.z(mid);
        if (wk === 'L' || wk === 'R') for (const zb of AGE_Z) if (Math.abs(zMid - zb) < 500 && R() < 0.3) st0 = zMid > zb ? st0 + 1 : st0 - 1;
        st0 = Math.max(0, Math.min(2, st0));
        for (let k = 0; k < ys.length - 1; k++) {
          const ya = ys[k] + (k ? 2 : 0), yb = ys[k + 1] - (k < ys.length - 2 ? 2 : 0);
          if (k) {
            rockQ(a, b, ys[k] - 2, ys[k] + 2, 0.24);
            for (let t = a + 5; t < b; t += 12) { const q = wpt(w, t, ys[k] + 0.5, 1); streetLights.push([q.x, q.y, q.z, ...STREET[st0 > 1 ? 1 : 0]]); }
          }
          const st = Math.max(0, Math.min(2, st0 + (R() < 0.1 ? (R() < 0.5 ? -1 : 1) : 0)));

          facBatches[st][v].quad(wpt(w, a, ya), w.T.clone().multiplyScalar(b - a), V(0, yb - ya, 0), facUV(a, b, ya, yb, uo));

    });
  }

  // ---------- orașul: blocuri care ies din perete, terase, pasarele, lifturi exterioare ----------
  const terraceLights = [], liftCabins = [];
  {
    const blocks = [];
    const blocked = (wk, t0, t1, y0) => MOUTHS.some(m => m.wk === wk && t1 > m.t - m.w / 2 - 25 && t0 < m.t + m.w / 2 + 25 && y0 < FL + m.h + 12)
      || (wk === 'F' && t1 > -290 && t0 < 290);

    });

      const w = WALLS[bk.wk], fb = facBatches[bk.st][(R() * 2) | 0], uo = R(), wd = bk.t1 - bk.t0, h = bk.y1 - bk.y0;
      fb.quad(wpt(w, bk.t0, bk.y0, bk.d), w.T.clone().multiplyScalar(wd), V(0, h, 0), facUV(bk.t0, bk.t1, bk.y0, bk.y1, uo));
      fb.quad(wpt(w, bk.t0, bk.y0, 0), w.N.clone().multiplyScalar(bk.d), V(0, h, 0), facUV(0, bk.d, bk.y0, bk.y1, uo + 0.3));
      fb.quad(wpt(w, bk.t1, bk.y0, bk.d), w.N.clone().multiplyScalar(-bk.d), V(0, h, 0), facUV(0, bk.d, bk.y0, bk.y1, uo + 0.6));
      roofBatch.quad(wpt(w, bk.t0, bk.y1, bk.d), w.T.clone().multiplyScalar(wd), w.N.clone().multiplyScalar(-bk.d), [[0, 0], [wd / 24, 0], [wd / 24, bk.d / 24], [0, bk.d / 24]]);

    });
    // pasarele între blocuri vecine, la aceeași înălțime

        bridgeBatch.quad(wpt(w, a.t1, y + 3, off), r, w.N.clone().multiplyScalar(-3));      // acoperișul pasarelei
        bridgeBatch.quad(wpt(w, a.t1, y, off - 3), r, w.N.clone().multiplyScalar(3));        // dedesubt

        terraceBatch.quad(wpt(w, t0, y - 1.5, 0), w.T.clone().multiplyScalar(tl), w.N.clone().multiplyScalar(d)); // dedesubt
        terraceBatch.quad(wpt(w, t0, y - 1.5, d), w.T.clone().multiplyScalar(tl), V(0, 1.5, 0));                  // muchia

  FAC.forEach((mats, st) => mats.forEach((m, v) => { if (!facBatches[st][v].empty()) mesh(facBatches[st][v].geo(), m); }));

  glows(streetLights, 4, 0.85);
  mesh(U.worldUV(roofBatch.geo(), 24), M.concDark);
  mesh(U.worldUV(terraceBatch.geo(), 24), M.conc);

  // ---------- gurile tunelurilor laterale: încăperi spre interior, luminate dinspre fund, cu inscripția deasupra ----------
  {

  // ---------- peretele catapultelor, în față: beton cu cele 6 guri, dungi, numere, semnale ----------

  // ---------- rampele catapultelor: punte, șine, bobine, grinzi cu zăbrele, stâlpi ----------
  const RAMP = { y0: -114, L: (-114 - FL) / 0.5 };              // puntea pornește de sub gura tunelului

    const seg = U.merge([

    const frame = U.merge([new THREE.BoxGeometry(2.2, 24, 2.2).translate(-27, 12, 0), new THREE.BoxGeometry(2.2, 24, 2.2).translate(27, 12, 0), new THREE.BoxGeometry(56.4, 2.4, 2.2).translate(0, 24, 0)]);

  // ---------- în sală (sau într-un tunel de catapultă) ----------
  function inside(p) {
    if (p.x > X0 && p.x < X1 && p.z < ZF && p.z > ZB && p.y > FL - 5 && p.y < vaultY(p.x) + 5) return true;

    const tl = ctx.T ? ctx.T.launch : null, on = tl !== null && tl !== undefined && tl >= 0;

    LIM.forEach(o => { o.im.count = 0; if (o.gm) o.gm.count = 0; });

    }
    LIM.forEach(o => { o.im.instanceMatrix.needsUpdate = true; if (o.gm) o.gm.instanceMatrix.needsUpdate = true; });

  }

  if (typeof console !== 'undefined') console.log('[sala] nave:', JSON.stringify(counts), 'total', Object.values(counts).reduce((a, b) => a + b, 0), 'triunghiuri', Math.round(fleetTris));
  return { group, update, inside, ghost: [], counts };
}

    [[-1, 6.55, 4.55, 0.26, [0.5, 0.22, 0.17]], [-1, 6.64, 3.95, 0.15, [0.34, 0.38, 0.35]], [1, 6.55, 4.55, 0.26, [0.34, 0.38, 0.35]], [1, 6.64, 3.95, 0.15, [0.42, 0.42, 0.42]]]
      .forEach(([sg, x, y, r, c]) => {
        const prof = [];
        for (let k = 0; k < 8; k++) { const a = k / 8 * 2 * PI; prof.push([sg * x + Math.cos(a) * r, y + Math.sin(a) * r]); }
        pipes.push(sweep(prof, 0.5, L - 0.5, 4, { closed: true, out: true, ref: [sg * x, y], col: s => { const l = lit(s, 3); return [c[0] * l[0] * 1.1, c[1] * l[1] * 1.1, c[2] * l[2] * 1.1]; } }));
      });
    mesh(U.merge(pipes), M.vc);
  }

  // ---------- indicatoarele: un atlas cu toate textele (16 rânduri de 1024 × 128) ----------
  const TXT = [];
  const row = (t, kind = 0) => { TXT.push([t, kind]); return TXT.length - 1; };
  const km = d => d >= 1000 ? (d / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(d / 50) * 50 + ' m';
  const hang = [];
  for (let s = 150; s < L - 100; s += 300) hang.push([s, row('SALA DE COMANDĂ  ↑  ' + km(L - s + VEST)), row('HANGARUL DE REPARAȚII  ↑  ' + km(s))]);
  const R_CMD = row('SALA DE COMANDĂ', 1), R_LIFT = row('LIFTUL 3  ·  ORAȘUL  ·  SALA MARE'), R_HANG = row('CORIDORUL 7  ·  SALA DE COMANDĂ  ' + km(L + VEST)), R_EXIT = row('IEȘIRE', 2);
  const ROWS = 16;
  const atlas = ctx.canvasTex(1024, 2048, (g, w, h) => {
    const rh = h / ROWS;
    TXT.forEach(([t, kind], i) => {
      const y = i * rh;
      g.fillStyle = kind === 2 ? '#0d5a2c' : '#18222d'; g.fillRect(0, y, w, rh);
      g.strokeStyle = kind === 2 ? '#b8f5c8' : '#5d6b78'; g.lineWidth = 4; g.strokeRect(6, y + 6, w - 12, rh - 12);
      g.fillStyle = kind === 2 ? '#e9fff0' : '#eef3f7';
      g.font = `bold ${kind === 1 ? 84 : 62}px "Helvetica Neue", Arial, sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(t, w / 2, y + rh / 2 + 3, w - 60);
    });
  });
  atlas.wrapS = atlas.wrapT = THREE.ClampToEdgeWrapping;
  atlas.anisotropy = 4;
  const SP = [], SU = [];
  // dreptunghi cu rândul r al atlasului: centrul c, axa textului rx (spre dreapta celui care citește), lățimea w, înălțimea h
  function sign(c, rx, w, h, r) {
    const v0 = 1 - (r + 1) / ROWS, v1 = 1 - r / ROWS, P = [[-1, -1, 0, v0], [1, -1, 1, v0], [1, 1, 1, v1], [-1, 1, 0, v1]];
    [0, 1, 2, 0, 2, 3].forEach(k => {
      const [a, b, u, vv] = P[k];
      SP.push(c.x + rx.x * a * w / 2, c.y + b * h / 2, c.z + rx.z * a * w / 2);
      SU.push(u, vv);
    });
  }
  hang.forEach(([s, rF, rB]) => {
    const f = at(s), T = V(f.tx, 0, f.tz), S = V(-f.tz, 0, f.tx), c = V(f.x, f.y + 5.7, f.z);
    sign(c.clone().addScaledVector(T, -0.03), S, 8, 1, rF);                     // îl citesc cei care merg spre sala de comandă
    sign(c.clone().addScaledVector(T, 0.03), S.clone().negate(), 8, 1, rB);     // și cei care se întorc la hangar
    [-3, 3].forEach(x => quad([[s - 0.04, x - 0.04, f.y + 6.2], [s + 0.04, x - 0.04, f.y + 6.2], [s + 0.04, x - 0.04, f.y + archY(Math.abs(x))], [s - 0.04, x - 0.04, f.y + archY(Math.abs(x))]], [0.2, 0.2, 0.22]));
  });

  // ---------- ușile laterale (ateliere, depozite, ieșiri) și ecranele: plecările din port și știrile bazei ----------
  const screenTex = ctx.canvasTex(1024, 288, (g, w, h) => {
    g.fillStyle = '#0a1420'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#1d3a5c'; g.fillRect(0, 0, 512, 46); g.fillRect(512, 0, 512, 46);
    g.textBaseline = 'middle';
    g.font = 'bold 26px Arial'; g.fillStyle = '#ffd23f'; g.fillText('PLECĂRI · PORTUL DIN ȘANȚ', 16, 23);
    g.fillStyle = '#ffffff'; g.fillText('ȘTIRILE BAZEI', 530, 23);
    g.font = '22px Arial';
    [['ORBITA PĂMÂNTULUI', '06:40', 'ÎMBARCARE'], ['STAȚIA L1', '07:15', 'LA TIMP'], ['CRATERUL COPERNIC', '08:05', 'LA TIMP'],
      ['MAREA CRIZELOR', '09:30', 'AMÂNAT'], ['POLUL SUD · MINELE', '10:10', 'LA TIMP']].forEach(([a, b, c], i) => {
      const y = 74 + i * 42;
      g.fillStyle = '#d8e4f0'; g.fillText(a, 16, y); g.fillText(b, 300, y);
      g.fillStyle = c === 'AMÂNAT' ? '#ff6a4a' : c === 'ÎMBARCARE' ? '#5dff8a' : '#9fd0ff'; g.fillText(c, 380, y);
    });
    g.fillStyle = '#e8eef5'; g.font = 'bold 27px Arial'; g.fillText('TURA A TREIA ÎNCEPE LA 14:00', 530, 82);
    g.fillStyle = '#2c4a6e'; g.fillRect(530, 112, 180, 150);
    g.fillStyle = '#8fa8c4'; for (let i = 0; i < 6; i++) g.fillRect(728, 116 + i * 24, 262 - (i % 3) * 40, 10);
  });
  {
    const SCP = [], SCU = [];
    // pe perete (sg = ±1), centrat în s, lat de w (de-a lungul coridorului), de la y0 la y1 deasupra podelei
    const onWall = (s, sg, w, y0, y1, inset, col, uvx) => {
      const f = at(s), x = sg * (HW - inset);
      const pts = [[s + sg * w / 2, x, f.y + y0], [s - sg * w / 2, x, f.y + y0], [s - sg * w / 2, x, f.y + y1], [s + sg * w / 2, x, f.y + y1]];
      if (!uvx) return quad(pts, col);
      const uv = [[uvx[0], 0], [uvx[1], 0], [uvx[1], 1], [uvx[0], 1]];
      [0, 1, 2, 0, 2, 3].forEach(k => { const [s1, sd, y] = pts[k], g = atInto(s1, fQ); SCP.push(g.x - g.tz * sd, y, g.z + g.tx * sd); SCU.push(...uv[k]); });
    };
    let n = 0;
    for (let s = 30; s < L - 40; s += 60) { if (!inR(s, [E1[0] - 6, E2[1] + 6])) onWall(s, n % 2 ? 1 : -1, 3.6, 2.3, 4.32, 0.03, null, n % 3 ? [0, 0.5] : [0.5, 1]); n++; }
    n = 0;
    for (let s = 15; s < L - 20; s += 45) {
      if (inR(s, [E1[0] - 4, E2[1] + 4])) continue;
      const sg = n % 2 ? -1 : 1, l = lit(s, 2);
      onWall(s, sg, 2.9, 0, 3.4, 0.02, [l[0] * 0.75, l[1] * 0.75, l[2] * 0.75]);
      onWall(s, sg, 2.4, 0, 3.0, 0.04, [0.2, 0.22, 0.24]);
      if (n % 3 === 0) {
        const f = at(s), S = V(-f.tz, 0, f.tx), T = V(f.tx, 0, f.tz);
        sign(V(f.x, f.y + 3.62, f.z).addScaledVector(S, sg * (HW - 0.05)), T.clone().multiplyScalar(-sg), 1.6, 0.2, R_EXIT);
      }
      n++;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(SCP, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(SCU, 2));
    mesh(g, new THREE.MeshBasicMaterial({ map: screenTex, side: THREE.DoubleSide }));
  }

  // ---------- anticamera sălii de comandă: liftul („Ocoli elevatorul”), ușa sălii, garda ----------
  // coordonate locale: x spre dreapta celui care vine pe coridor, y în sus, z de la peretele sălii (0) spre coridor (30)
  const fe = at(L), Tv = V(fe.tx, 0, fe.tz), Sv = V(-fe.tz, 0, fe.tx), Zv = Tv.clone().negate();
  const Ov = V(CMD.center.x + ca * CMD.r, CMD.y0, CMD.center.z + sa * CMD.r);
  const Mv = new THREE.Matrix4().makeBasis(Sv, V(0, 1, 0), Zv).setPosition(Ov);
  const loc = (x, y, z) => Ov.clone().addScaledVector(Sv, x).addScaledVector(Zv, z).setY(Ov.y + y);
  const notch = (hw, H, hole) => {   // perete plin cu o deschidere care pornește din podea (poligon simplu, fără găuri)
    const sh = new THREE.Shape();
    sh.moveTo(-hw, 0);
    hole.forEach(([x, y]) => sh.lineTo(x, y));
    sh.lineTo(hw, 0); sh.lineTo(hw, H); sh.lineTo(-hw, H); sh.lineTo(-hw, 0);
    const g = new THREE.ShapeGeometry(sh);
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 8, uv.getY(i) / 6);
    return g;
  };
  const shadeY = (g, k0, k1, tint) => {   // lumină coaptă după înălțime (local), înainte de mutare
    const p = g.attributes.position, c = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) { const k = k0 + (k1 - k0) * Math.min(1, Math.max(0, p.getY(i) / 10)); c.set([tint[0] * k, tint[1] * k, tint[2] * k], i * 3); }
    g.setAttribute('color', new THREE.BufferAttribute(c, 3));
    return g;
  };
  {
    const sod = [1, 0.8, 0.58], walls = [], flo = [];
    const DW = CMD.doorW / 2, DH = CMD.doorH;
    walls.push(shadeY(notch(18, 10, [[-DW, 0], [-DW, DH], [DW, DH], [DW, 0]]), 0.5, 0.85, sod));          // peretele sălii, cu ușa
    walls.push(shadeY(notch(18, 10, PROF).rotateY(PI).translate(0, 0, VEST), 0.5, 0.85, sod));            // peretele dinspre coridor
    walls.push(shadeY(new THREE.PlaneGeometry(VEST, 10).rotateY(PI / 2).translate(-18, 5, VEST / 2), 0.5, 0.85, sod));
    walls.push(shadeY(new THREE.PlaneGeometry(VEST, 10).rotateY(-PI / 2).translate(18, 5, VEST / 2), 0.5, 0.85, sod));
    walls.push(shadeY(new THREE.PlaneGeometry(36, VEST).rotateX(PI / 2).translate(0, 10, VEST / 2), 0.45, 0.45, sod));
    [2, 3, 4].forEach(i => { const uv = walls[i].attributes.uv; for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) * (i === 4 ? 36 : VEST) / 8, uv.getY(k) * 10 / 6); });
    flo.push(shadeY(new THREE.PlaneGeometry(36, VEST).rotateX(-PI / 2).translate(0, 0, VEST / 2), 0.8, 0.8, sod));
    { const uv = flo[0].attributes.uv; for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) * 36 / 8, uv.getY(k) * VEST / 8); }
    mesh(U.merge(walls).applyMatrix4(Mv), M.conc);
    mesh(U.merge(flo).applyMatrix4(Mv), M.floor);

    // liftul: o cușcă de oțel și sticlă, puțin la stânga drumului spre ușă; ușile lui privesc spre coridor
    const P = (g, c) => U.paint(g, new THREE.Color(c[0], c[1], c[2]));
    const lift = [   // destul de jos cât să se vadă inscripția sălii pe deasupra
      P(U.box(-7.8, -2.2, 0, 5.6, 12.2, 17.8), [0.12, 0.16, 0.2]),
      P(U.box(-8.05, -1.95, 5.1, 5.7, 11.95, 18.05), [0.55, 0.57, 0.6]),
      ...[[-8, 12], [-2, 12], [-8, 18], [-2, 18]].map(([x, z]) => P(U.box(x - 0.25, x + 0.25, 0, 5.6, z - 0.25, z + 0.25), [0.55, 0.57, 0.6])),
    ];
    [[-7.2, -5.3], [-4.7, -2.8]].forEach(([x0, x1]) => {
      lift.push(P(U.box(x0 - 0.14, x1 + 0.14, 0, 3.06, 17.99, 18.05), [1, 0.86, 0.6]));
      lift.push(P(U.box(x0, x1, 0, 2.9, 18.04, 18.1), [0.42, 0.44, 0.47]));
      lift.push(P(U.box((x0 + x1) / 2 - 0.3, (x0 + x1) / 2 + 0.3, 3.3, 3.6, 18.0, 18.08), [1, 0.62, 0.2]));
    });
    // rama ușii sălii de comandă, steagurile, pupitrul gărzii, lămpile din tavan
    const fr = [
      P(U.box(-DW - 0.6, -DW, 0, DH + 0.6, 0, 0.5), [0.5, 0.52, 0.55]), P(U.box(DW, DW + 0.6, 0, DH + 0.6, 0, 0.5), [0.5, 0.52, 0.55]),
      P(U.box(-DW - 0.6, DW + 0.6, DH, DH + 0.6, 0, 0.5), [0.5, 0.52, 0.55]),
      P(U.box(5.8, 9.6, 0, 1.05, 2.6, 4.2), [0.2, 0.21, 0.23]), P(U.box(6, 9.4, 1.05, 1.12, 2.8, 3.3), [0.45, 0.75, 0.95]),
    ];
    [-9, 9].forEach(x => [U.COL.blue, U.COL.yellow, U.COL.red].forEach((c, i) => fr.push(U.paint(U.box(x - 1.2 + i * 0.8, x - 0.4 + i * 0.8, 3.2, 4.8, 0.02, 0.06), c))));
    [-10, 0, 10].forEach(x => [9, 22].forEach(z => fr.push(P(U.box(x - 1.8, x + 1.8, 9.82, 9.95, z - 0.6, z + 0.6), [1, 0.94, 0.82]))));
    mesh(U.merge([...lift, ...fr]).applyMatrix4(Mv), M.vc);
    sign(loc(0, 7.9, 0.08), Sv, 9.6, 1.2, R_CMD);
    sign(loc(-5, 4.55, 18.13), Sv, 5.6, 0.7, R_LIFT);
  }

  // ---------- rama ușii din hangar: inscripția spre coridor ----------
  {
    const f = at(0), T = V(f.tx, 0, f.tz), S = V(-f.tz, 0, f.tx);
    const Mh = new THREE.Matrix4().makeBasis(S, V(0, 1, 0), T.clone().negate()).setPosition(V(f.x, f.y, f.z).addScaledVector(T, -0.06));
    const fg = notch(9.5, 10.5, PROF);
    { const p = fg.attributes.position, c = new Float32Array(p.count * 3); for (let i = 0; i < p.count; i++) c.set([0.72, 0.7, 0.66], i * 3); fg.setAttribute('color', new THREE.BufferAttribute(c, 3)); }
    mesh(fg.applyMatrix4(Mh), M.conc);
    sign(V(f.x, f.y + 9.1, f.z).addScaledVector(T, -0.1), S, 8, 1, R_HANG);
  }

  // indicatoarele și scările, la urmă (după ce s-au adunat toate)
  {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(SP, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(SU, 2));
    mesh(g, new THREE.MeshBasicMaterial({ map: atlas }));
    const q = new THREE.BufferGeometry();
    q.setAttribute('position', new THREE.Float32BufferAttribute(QP, 3));
    q.setAttribute('color', new THREE.Float32BufferAttribute(QC, 3));
    mesh(q, M.vc2);
  }

  // ---------- oamenii: „Plin de forfotă de oameni” (r. 291) ----------
  const beltV = s => inR(s, BELTS) ? 2.4 : inR(s, E1) || inR(s, E2) ? 0.75 : 0;   // m/s: benzile rapide, scările rulante
  const onStairs = s => inR(s, E1) || inR(s, E2);
  const NP = 1300, folk = [];
  for (let i = 0; i < NP; i++) {
    const r = R();
    let side, walk, dir = 0;
    if (r < 0.4) { const ln = LANES[R() < 0.5 ? 0 : 1]; side = ln[0] + 0.45 + R() * (ln[1] - ln[0] - 0.9); dir = ln[2]; walk = R() < 0.55 ? 0 : 0.5 + R() * 0.8; }
    else if (r < 0.65) { side = -1.4 + R() * 2.8; walk = (R() < 0.5 ? 1 : -1) * (1.0 + R() * 0.6); }
    else { const sg = R() < 0.5 ? -1 : 1; side = sg * (4.95 + R() * 1.6); walk = R() < 0.18 ? 0 : sg * (0.9 + R() * 0.6); }   // pe margini, toți țin dreapta
    folk.push({ s: R() * L, side, walk, dir, yaw: R() * 2 * PI, sc: 0.92 + R() * 0.14 });
  }
  // anticamera: coada la lift, cei care trec pe lângă el, garda de la ușă
  const still = [];
  for (let i = 0; i < 10; i++) still.push([-7 + R() * 4.4, 19.2 + R() * 3.5, PI + (R() - 0.5) * 0.8]);
  for (let i = 0; i < 26; i++) {
    let x, z;
    do { x = -16 + R() * 32; z = 3 + R() * 25; } while (x > -9 && x < -1 && z > 11 && z < 24);
    still.push([x, z, (R() < 0.5 ? 0 : PI) + (R() - 0.5) * 1.2]);
  }
  still.push([-6.4, 1.3, 0], [6.4, 1.3, 0], [7.6, 5, PI]);
  const NV = still.length;
  const pal = (a, k) => a[(k * a.length) | 0];
  const CLOTH = [0xd06a1e, 0x2f4f8f, 0x6b6f75, 0x55613f, 0x46505e, 0xb9a57f, 0x2b2b30, 0x8f2a2a, 0xd8d8d8, 0x3f6b4f, 0x4f6f9f, 0x9c8a6a];
  const SKIN = [0xe0b89a, 0xc89874, 0x9a6b4b, 0xf0d0b8, 0xb07a5a];
  const bodyGeo = U.merge([U.paint(U.box(-0.17, 0.17, 0, 0.84, -0.1, 0.1), 0x6e6e6e), U.paint(U.box(-0.23, 0.23, 0.84, 1.46, -0.12, 0.12), 0xffffff)]);
  const headGeo = U.box(-0.1, 0.1, 1.48, 1.72, -0.1, 0.11);
  const bodies = new THREE.InstancedMesh(bodyGeo, new THREE.MeshLambertMaterial({ vertexColors: true }), NP + NV);
  const heads = new THREE.InstancedMesh(headGeo, new THREE.MeshLambertMaterial(), NP + NV);
  [bodies, heads].forEach(m => { m.frustumCulled = false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); inn.add(m); });
  const cc = new THREE.Color();
  for (let i = 0; i < NP + NV; i++) {
    const guard = i >= NP + NV - 3;
    bodies.setColorAt(i, cc.setHex(guard ? 0x46505e : pal(CLOTH, R())));
    heads.setColorAt(i, cc.setHex(pal(SKIN, R())));
  }
  const dummy = new THREE.Object3D(), fP = {};
  still.forEach(([x, z, a], k) => {
    const p = loc(x, 0, z), d = Sv.clone().multiplyScalar(Math.sin(a)).addScaledVector(Zv, Math.cos(a));
    dummy.position.copy(p); dummy.rotation.set(0, Math.atan2(d.x, d.z), 0); dummy.scale.setScalar(0.95 + R() * 0.1); dummy.updateMatrix();
    bodies.setMatrixAt(NP + k, dummy.matrix); heads.setMatrixAt(NP + k, dummy.matrix);
  });
  function placeFolk() {
    folk.forEach((p, i) => {
      const f = atInto(p.s, fP), b = p.dir ? beltV(p.s) : 0;
      const y = b ? f.y + 0.3 : !p.dir && onStairs(p.s) ? yLin(p.s) + 0.1 : f.y;
      const go = p.dir || p.walk;
      dummy.position.set(f.x - f.tz * p.side, y, f.z + f.tx * p.side);
      dummy.rotation.set(0, go ? Math.atan2(f.tx, f.tz) + (go < 0 ? PI : 0) : p.yaw, 0);
      dummy.scale.setScalar(p.sc);
      dummy.updateMatrix();
      bodies.setMatrixAt(i, dummy.matrix); heads.setMatrixAt(i, dummy.matrix);
    });
    bodies.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true;
  }
  placeFolk();

  // ---------- mișcarea: benzile, scările, oamenii (doar când camera e aproape) ----------
  const coarse = [];
  for (let s = 0; s <= L; s += 20) { const f = at(s); coarse.push(f.x, f.y, f.z); }
  const near = () => {
    const c = ctx.camera.position;
    for (let i = 0; i < coarse.length; i += 3) { const dx = c.x - coarse[i], dy = c.y - coarse[i + 1], dz = c.z - coarse[i + 2]; if (dx * dx + dy * dy + dz * dz < 160000) return true; }
    return false;
  };
  let last = null;
  function update(t) {
    const dt = last === null ? 0 : Math.min(0.1, Math.max(0, t - last));
    last = t;
    beltTex.offset.y = (t * 2.4 / 1.6) % 1;
    stepTex.offset.y = (t * 0.75 / 1.6) % 1;
    if (!dt || !near()) return;
    folk.forEach(p => {
      if (p.dir) { const b = beltV(p.s); p.s += p.dir * (b ? b + p.walk : 1.2) * dt; }
      else p.s += p.walk * (onStairs(p.s) ? 0.45 : 1) * dt;
      if (p.s > L) p.s -= L; else if (p.s < 0) p.s += L;
    });
    placeFolk();
  }

  // vederile: pe coridor, cu 45 m înainte de anticameră, de pe culoarul din mijloc, spre ușa sălii de comandă
  const fv = at(L - 45), Sc = V(-fv.tz, 0, fv.tx);
  const views = {
    coridor: { pos: V(fv.x, fv.y + 2.5, fv.z).addScaledVector(Sc, 1.0).toArray().map(v => +v.toFixed(1)), at: loc(0, 3.2, 0).toArray().map(v => +v.toFixed(1)) },
  };
  return { group: inn, update, path: { L, at, E1, E2, BELTS }, views };
}

<script>
// ---- mod-baza.js ----
// ---------- Baza de pe Lună în bătălie: v2, din scripts/baza3d ----------
// Modulele bazei sunt aceleași fișiere ca pagina ei (scripts/baza3d/PLAN.md): gura cu cele 6 catapulte, suprafața cu cupola,
// sala mare, hangarul de reparații (al lui Lionea) și drumul lui Lionea. Aici doar se pornesc cu contextul bătăliei și se dă
// luptei ce-i trebuie: porțile, catapultele, cupola, inside(p), update(t). Varianta 1 (peștera mică): _scratch/batalia3d-inainte-de-baza2/.

  // ---------- unelte de construcție ----------
  const T = (geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) =>

  const basis = (geo, xa, ya, za, p) => geo.applyMatrix4(new THREE.Matrix4().makeBasis(xa, ya, za).setPosition(p));   // pune o placă pe o față

  function merge(geos) {   // lipește geometriile; culoarea pe vârfuri, unde lipsește, e albă
    let n = 0, ni = 0;
    geos.forEach(g => { n += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; });
    const P = new Float32Array(n * 3), N = new Float32Array(n * 3), U = new Float32Array(n * 2), C = new Float32Array(n * 3).fill(1), I = new Uint32Array(ni);
    let o = 0, oi = 0;
    geos.forEach(g => {
      const c = g.attributes.position.count;
      P.set(g.attributes.position.array, o * 3);
      N.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) U.set(g.attributes.uv.array, o * 2);
      if (g.attributes.color) C.set(g.attributes.color.array, o * 3);
      if (g.index) for (let i = 0; i < g.index.count; i++) I[oi++] = g.index.array[i] + o;
      else for (let i = 0; i < c; i++) I[oi++] = o + i;
      o += c;
    });

    g.setAttribute('position', new THREE.BufferAttribute(P, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(N, 3));

  const add = (parent, geo, mat) => { const m = new THREE.Mesh(geo, mat); parent.add(m); return m; };

  let B = {}, skip = false;   // skip: piesele (și luminile) unei părți care lipsește la copii se construiesc, dar nu se pun

  // O plasă din inele de puncte (fiecare inel e un contur închis, sau deschis cu open). key(r, i) dă materialul fâșiei
  // dintre inelele r, r+1 și punctele i, i+1 (null = gol). Fețele sunt plate, ca la tabla îndoită: de aici muchiile vii.
  function loft(rings, key, { open = false, col = null, v = p => p[1], us = 1 / 8 } = {}) {
    const n = rings[0].length, segs = open ? n - 1 : n, acc = {};
    const arc = rings.map(rg => { const a = [0]; for (let i = 0; i < n; i++) { const p = rg[i], q = rg[(i + 1) % n]; a.push(a[i] + Math.hypot(q[0] - p[0], q[1] - p[1], q[2] - p[2])); } return a; });
    for (let r = 0; r + 1 < rings.length; r++) for (let i = 0; i < segs; i++) {
      const k = key(r, i);
      if (!k) continue;
      const A = acc[k] = acc[k] || { P: [], U: [], C: [] }, j = (i + 1) % n;
      const q = [[r, i, i], [r, j, i + 1], [r + 1, j, i + 1], [r + 1, i, i]];
      [0, 1, 2, 0, 2, 3].forEach(t => {
        const [rr, ii, ai] = q[t], p = rings[rr][ii];
        A.P.push(...p);
        A.U.push(arc[rr][ai] * us, v(p) * us);
        A.C.push(...(col ? col(p) : [1, 1, 1]));

    for (const k in acc) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(acc[k].P, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(acc[k].U, 2));
      g.setAttribute('color', new THREE.Float32BufferAttribute(acc[k].C, 3));

  function capRing(ring, k) {   // închide un inel cu un evantai din centru
    const c = ring.reduce((s, p) => [s[0] + p[0] / ring.length, s[1] + p[1] / ring.length, s[2] + p[2] / ring.length], [0, 0, 0]), P = [];
    ring.forEach((p, i) => P.push(...c, ...p, ...ring[(i + 1) % ring.length]));
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(new Array(P.length / 3 * 2).fill(0), 2));
    g.computeVertexNormals();
    put(k, g);
  }

  // ---------- corpul ----------
  // Fuzelaj lung și turtit, cu muchii laterale (chine) și botul ascuțit, puțin lăsat. Secțiunea e un hexagon turtit:
  // puntea plată sus, umerii, muchia, burta plată. Corpul plin e între y = -10,5 și 5; de acolo se ascute spre bot (y = 16)
  // și se strânge spre coadă (y = -14,6), unde duzele intră pe jumătate în corp.
  const Y_TAIL = -14.6, Y_NOSE = 16, Y_N0 = 5;
  function sec(y, inset = 0) {
    let w, top, bot, ch;
    if (y >= Y_N0) {
      const t = Math.min(1, (y - Y_N0) / (Y_NOSE - Y_N0));
      w = Math.max(0.02, 3.2 * Math.pow(1 - Math.pow(t, 1.6), 0.9));
      top = 0.05 + 1.95 * Math.pow(1 - Math.pow(t, 1.4), 0.8);
      bot = -0.12 - 1.58 * Math.pow(1 - Math.pow(t, 1.3), 0.7);
      ch = -0.1 * t;
    } else {
      const k = sm(-11.5, Y_TAIL, y);
      w = 3.2 - 1.0 * k; top = 2.0 - 0.65 * k; bot = -1.7 + 0.5 * k; ch = 0;
    }
    return { w: Math.max(0.03, w - inset), top: top - inset, bot: bot + inset, ch };
  }
  function ring2(y, inset = 0) {   // conturul secțiunii, (x, z), de la mijlocul punții spre tribord, pe sub burtă și înapoi pe babord
    const { w, top, bot, ch } = sec(y, inset);
    const half = [[0.55 * w, top], [0.9 * w, ch + (top - ch) * 0.55], [w, ch], [0.8 * w, ch + (bot - ch) * 0.7], [0.5 * w, bot]];

  }
  const ring3 = (y, inset) => ring2(y, inset).map(([x, z]) => [x, y, z]);
  // fâșiile: 0-2 și 9-11 sunt tabla de sus (0 și 11 = puntea), 3-8 burta cu plăcile termice
  const TOPSEG = i => i <= 2 || i >= 9;
  // golurile din punte: carlinga, turela, trapa
  const CANOPY = [8, 12.25], TURRET_Y = -7.5, TUR = [-8.75, -6.25], HATCH = [3.0, 4.2];
  const deckGap = y => (y >= CANOPY[0] && y < CANOPY[1]) || (TURRET && y >= TUR[0] && y < TUR[1]) || (y >= HATCH[0] && y < HATCH[1]);
  const stations = [];
  for (let y = Y_TAIL; y < -10.5; y += 0.5) stations.push(y);
  stations.push(-10.5, TUR[0], TUR[1], -2, 1, HATCH[0], HATCH[1]);
  for (let y = Y_N0; y <= Y_NOSE + 1e-6; y += 0.25) stations.push(+y.toFixed(2));
  const burn = p => {   // urmele de ardere: la duze și pe bot (de la intrarea în atmosferă)
    const d = Math.max(0.6 * sm(-10, Y_TAIL, p[1]), 0.5 * sm(12, Y_NOSE, p[1]));

  };
  const ship = new THREE.Group();
  const lit = l => { if (opts.lights !== false && !skip) ship.add(l); };   // luminile punctuale: doar unde scena e mică
  {
    const rings = stations.map(y => ring3(y, 0));

  // puntea din jurul turelei și al trapei: tablă cu gaura rotundă, respectiv pătrată
  function deckPlate(y0, y1, hole) {
    const w = 0.55 * sec(y0).w, s = new THREE.Shape();
    s.moveTo(-w, y0); s.lineTo(w, y0); s.lineTo(w, y1); s.lineTo(-w, y1); s.closePath();

    const u = g.attributes.uv, p = g.attributes.position;

  [-1, 1].forEach(s => {

  // ampenajul: câte o aripioară verticală în vârful fiecărei aripi, trasă înapoi, cu vârful tăiat oblic, și două mici sub coadă.
  // Pe spinare nu e nimic: aripioarele urcă doar până la ~1,6 m, sub țevile lui Vova (2,3 m), deci turela trage în tot spatele.

  function fin(s, o) {

  const FIN = { x: WTIP.x - 0.17, z: WTIP.z0 + 0.03, cant: 0.15, dir: 1, h: 2.4, le0: -8.6, te0: -11.2, le1: -10.5, te1: -12.0, t0: 0.16, t1: 0.07, cut: 0.15, mat: 'hull' };

  [-1, 1].forEach(s => {
    const { u, n } = fin(s, FIN);

    const k = 0.45, h = k * FIN.h * 0.9, t = FIN.t0 + (FIN.t1 - FIN.t0) * k + 0.02, y = (FIN.le0 + (FIN.le1 - FIN.le0) * k + FIN.te0 + (FIN.te1 - FIN.te0) * k) / 2;

  // compartimentele de rachete: două carene sub muchiile laterale, cu ușile pe burtă
  const BAY = { x: 3.3, z: -0.5, y0: -5.0, y1: 1.0 };

  // motoarele: o duză mare la mijloc și două de manevră, intrate pe jumătate în coadă. Fundul cozii e o placă

  put('dark', new THREE.TorusGeometry(MAIN.r + 0.02, 0.06, 6, 32).rotateX(PI / 2).translate(0, MAIN.y, MAIN.z));
  [-1, 1].forEach(s => {
    put('nozzle', bell(SIDE.r, 0.25, SIDE.y, 1.4).translate(s * SIDE.x, 0, SIDE.z));
    put('dark', new THREE.TorusGeometry(SIDE.r + 0.02, 0.04, 6, 20).rotateX(PI / 2).translate(s * SIDE.x, SIDE.y, SIDE.z));
  });
  {
    const sh = new THREE.Shape();

    holes.forEach(([x, z, r, t]) => {
      put('nozzle', new THREE.TorusGeometry(r + t * 0.4, t, 8, 36).rotateX(PI / 2).translate(x, Y_TAIL - 0.02, z));

  const RCS = [];
  [-1, 1].forEach(s => {
    const y = 13.2, { w } = sec(y);

    RCS.push({ p: V3(s * (WTIP.x + 0.1), -9.6, WTIP.z0 + 0.25), d: V3(s, 0, 0) });

    // focul de acoperire, fără morți: rafale scurte în toate părțile
    BATS.forEach((s, i) => {
      for (let tb = s.te + 7 + rr() * 3; tb < Math.min(s.td, 262); tb += 3.5 + rr() * 3) {
        const L = pool[((tb * 13) | 0) % pool.length];
        FX.stream({ t0: tb, t1: tb + 1.1, rate: 12, speed: 1300, spread: 30, col: [1, 0.8, 0.4], src: (t, o) => s.pos(t, o), dst: (t, o) => lamaPos(L, t, o), seed: 64000 + i * 100 + (tb | 0) });
      }
    });
    pool.forEach((L, i) => {
      if (i % 3) return;
      for (let tb = 199 + rr() * 4; tb < Math.min(L.td, 262); tb += 4 + rr() * 4) {
        const targets = BATS.filter(s => s.te + 6 < tb && s.td > tb + 1);
        if (!targets.length) continue;
        const s = targets[((tb * 7) | 0) % targets.length];
        FX.stream({ t0: tb, t1: tb + 1, rate: 12, speed: 1300, spread: 30, col: [0.65, 0.85, 1], src: (t, o) => lamaPos(L, t, o), dst: (t, o) => s.pos(t, o), seed: 65000 + i * 100 + (tb | 0) });
      }
    });
  }
  // căderile, calculate o dată, cu exploziile lor
  const fTmp = V3(0, 0, 0), fTmp2 = V3(0, 0, 0);
  LAME.forEach(L => {
    if (L.td === Infinity) return;
    const save = L.td;
    L.td = Infinity;
    const p0 = lamaPos(L, save, V3(0, 0, 0)), v0 = lamaPos(L, save + 0.05, fTmp).clone().sub(p0).divideScalar(0.05);
    L.td = save;
    L.fall = makeFall(p0, v0, save, 8000 + L.idx);
    L.qd = new THREE.Quaternion();
    L.td = Infinity;
    velQuat((t, o) => lamaPos(L, t, o), save - 0.1, L.qd, V3(1, 0, 0), true);
    L.td = save;
    FX.boom(save, p0, 48, 'fire');
    FX.boom(save + 0.05, p0, 12, 'spark');
    FX.boom(L.fall.tImpact, L.fall.end, 32, 'fire');
    FX.boom(L.fall.tImpact + 0.05, L.fall.end, 110, 'dust');
  });
  SUM.forEach((s, i) => {
    if (s.td === Infinity) return;
    const p0 = s.track(s.td, V3(0, 0, 0)), v0 = s.track(s.td + 0.05, V3(0, 0, 0)).sub(p0).divideScalar(0.05);
    s.fall = makeFall(p0, v0, s.td, 9000 + i);
    s.qd = new THREE.Quaternion();
    velQuat(s.track, s.td - 0.1, s.qd, s.park);
    FX.boom(s.td, p0, 60, 'fire');
    FX.boom(s.td + 0.3, p0.clone().add(V3(4, 2, 0)), 30, 'fire');
    FX.boom(s.fall.tImpact, s.fall.end, 45, 'fire');
    FX.boom(s.fall.tImpact + 0.05, s.fall.end, 150, 'dust');
  });

  // ---------- bomba nucleară pe cuirasat ----------
  {
    const t0 = 170, p0 = rocketPos(t0, V3(0, 0, 0)), m0 = rocketPos(t0 + 0.05, V3(0, 0, 0)).sub(p0).divideScalar(0.05);
    const q = new THREE.Quaternion(), hit = V3(0, 0, 0);
    cruiserPose(0, T_HIT - 0.01, hit, q);
    hit.add(V3(17, 0, 0).applyQuaternion(q));   // în coastă
    FX.missile({ t0, t1: T_HIT, size: 18, col: [1, 0.9, 0.7], path: (t, out) => hermite(out, p0, m0, hit, hit.clone().sub(p0).normalize().multiplyScalar(260), (t - t0) / (T_HIT - t0), T_HIT - t0) });
    FX.boom(T_HIT, hit, 2600, 'nuke');
    // exploziile din corp cât cade, apoi lovitura în colb și focul din epavă
    const cp = V3(0, 0, 0), cq = new THREE.Quaternion();
    for (let tt = T_HIT + 0.6; tt < T_CRASH; tt += 0.7) {
      cruiserPose(0, tt, cp, cq);
      FX.boom(tt, cp.clone().add(V3((hashN(tt * 9, 1) - 0.5) * 30, (hashN(1, tt * 9) - 0.5) * 200, (hashN(tt * 9, 2) - 0.5) * 30).applyQuaternion(cq)), 30 + hashN(tt, 7) * 30, 'fire');
    }
    FX.boom(T_CRASH, CRASH, 320, 'fire');
    [[0, 0, 0, 900], [160, 0, 90, 700], [-180, 0, -60, 750], [40, 0, 200, 1200]].forEach(([x, y, z, s], i) => FX.boom(T_CRASH + i * 0.4, CRASH.clone().add(V3(x, y + 30, z)), s, 'dust'));
    for (let tt = T_CRASH + 1.5; tt < T_END; tt += 2.6) FX.boom(tt, CRASH.clone().add(V3((hashN(tt, 4) - 0.5) * 180, 20, (hashN(4, tt) - 0.5) * 120)), 22 + hashN(tt, 5) * 20, 'fire');
  }

  // ---------- intrările pentru picking și urmărire ----------
  const lamaAnchors = new Map();
  FLY.forEach(L => {
    const isD = L === dragos;
    L.ent = { name: isD ? 'Lama lui Dragoș și a Elenei' : 'Lama', label: isD ? 'Dragoș și Elena' : null, fem: true, radius: 14,
      pos: (t, out) => lamaPos(L, t, out), hidden: t => t < L.launch, deadAt: L.td === Infinity ? null : L.td,

        : L.role === 'chaser' ? 'Unul din cei trei urmăritori ai lui Lionea.' : 'Celulă de vânătoare, 25 m: o familie, doi oameni.',
      pov: () => {
        if (!lamaAnchors.has(L)) {
          const o = new THREE.Object3D(), a = new THREE.Object3D();
          a.position.set(13.5, 2.4, 0);   // în vârful botului, înaintea carlingii: altfel colții Lamei acoperă privirea
          a.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V3(0, 0, 1), V3(1, 0, 0), V3(0, 1, 0)));
          o.add(a);

          lamaAnchors.set(L, { o, a });

      },

    entities.push(L.ent);

  SUM.forEach(s => {
    entities.push({ name: s.name, sum: true, radius: (s.o.userData.len || 30) * 0.6, pos: s.pos, deadAt: s.td === Infinity ? null : s.td, fem: s.kind !== 'trans',
      note: s.note, pov: s.o.userData.cockpit ? () => s.o.userData.cockpit : null, hidden: t => s.kind === 'trans' && t < s.te,
      behind: t => { s.pos(t + 0.1, vA); s.pos(t, vB); const d = vB.sub(vA); return d.lengthSq() < 1e-4 ? V3(0.4, 0.4, 1).normalize() : d.normalize().add(V3(0, 0.4, 0)).normalize(); } });
  });
  const dragosEnt = dragos.ent;

  // ---------- fiecare cadru ----------
  const uP = V3(0, 0, 0), uQ = new THREE.Quaternion(), uM = new THREE.Matrix4(), ZERO = new THREE.Matrix4().makeScale(0, 0, 0), spinQ = new THREE.Quaternion();
  const cCol = new THREE.Color();
  function setFlame(o, thr) {
    if (o.userData.setFlame) return o.userData.setFlame(thr);
