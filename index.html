    f.visible = thr > 0.04;
    f.scale.y = Math.max(0.01, thr);
  }
  function update(t) {
    // dreadnoughturile
    DREAD.forEach((d, k) => {
      dreadPos(k, t, d.o.group.position);
      dreadQuat(k, t, d.o.group.quaternion);
      let charge = 0;
      for (const ts of shots[k]) {
        const dtc = ts - t;
        if (dtc >= 0 && dtc < 1.6) charge = Math.max(charge, 1 - dtc / 1.6);
        else if (dtc < 0 && dtc > -0.6) charge = Math.max(charge, 1 + dtc / 0.6);
      }
      d.o.mouthMat.emissiveIntensity = 0.25 + charge * 5;
      d.o.mouthMat.emissive.setRGB(1, 0.55 + 0.3 * (1 - charge), 0.25);
    });
    // flăcările de manevră au un singur material, comun dreadnoughturilor și crucișătoarelor
    DREAD[0].o.manPlumes[0].material.opacity = t < 24 ? 0.9 * (1 - smooth(14, 24, t)) + 0.15 : (t > 44 && t < 62) || (t > 140 && t < 166) ? 0.55 : 0.12;
    // crucișătoarele
    CR.forEach((c, i) => {
      cruiserPose(i, t, c.o.position, c.o.quaternion);
      c.o.userData.plumes.forEach(pl => { pl.visible = !(i === 0 && t >= T_HIT); });   // după bombă, motoarele cuirasatului tac
    });
    // Lamele
    for (const L of LAME) {
      if (!L.fly) {
        dockWorld(L, t, uP, uQ);
        lamaMesh.setMatrixAt(L.idx, uM.compose(uP, uQ, ONE));
        crossMesh.setMatrixAt(L.idx, ZERO);
        continue;
      }
      if (t >= L.td) {
        L.fall.pos(t, uP);
        const tau = Math.min(t, L.fall.tImpact) - L.td;
        uQ.copy(L.qd).multiply(spinQ.setFromAxisAngle(L.fall.axis, L.fall.spin * tau));
      } else if (t < L.tB) {
        lamaPos(L, t, uP);
        uQ.copy(L.qA);
        if (t < L.launch) dockWorld(L, t, uP, uQ);
      } else if (L === dragos && t > 309) {
        lamaPos(L, t, uP);
        velQuat((tt, o) => lamaPos(L, tt, o), 309, uQ, V3(1, 0, 0), true);
        uQ.slerp(basisX(V3(0, 0, -1), UPW, spinQ), smooth(309, 316, t));
      } else {
        lamaPos(L, t, uP);
        velQuat((tt, o) => lamaPos(L, tt, o), t, uQ, V3(1, 0, 0), true, 1);
        if (t < L.tB + 2) uQ.slerp(L.qA, 1 - smooth(L.tB, L.tB + 2, t));
      }
      uM.compose(uP, uQ, ONE);
      lamaMesh.setMatrixAt(L.idx, uM);
      const cx = t - L.launch;
      if (cx > 0.5 && cx < 4.5 && t < L.td) {
        crossMesh.setMatrixAt(L.idx, uM);
        const k = Math.sin(Math.PI * (cx - 0.5) / 4);
        crossMesh.setColorAt(L.idx, cCol.setRGB(k, k * 0.9, k * 0.75));
      } else crossMesh.setMatrixAt(L.idx, ZERO);
      const an = lamaAnchors.get(L);
      if (an) { an.o.position.copy(uP); an.o.quaternion.copy(uQ); }
    }
    lamaMesh.instanceMatrix.needsUpdate = true;
    crossMesh.instanceMatrix.needsUpdate = true;
    if (crossMesh.instanceColor) crossMesh.instanceColor.needsUpdate = true;
    // racheta lui Lionea
    rocketPos(t, rocket.position);
    velQuat(rocketPos, t, rocket.quaternion, rocketFall, false, 1);
    let thr = t < 100.8 ? 0 : motion.speed > 4 ? Math.min(1.3, 0.55 + Math.max(0, motion.aF) / 40) : 0;
    if (t > 255 && t < 262) thr *= hashN((t * 12) | 0, 9) > 0.45 ? 1 : 0.1;   // „Gaz tot nu-i!”
    setFlame(rocket, thr);
    rocket.visible = rocket.position.lengthSq() < 4e8;
    const rs = t < 101.9 ? ctx.sceneIn : scene;   // în hangar e sub rocă; afară, la Soare
    if (rocket.parent !== rs) rs.add(rocket);
    if (rocket.userData.gear) rocket.userData.gear.visible = t < 102.6;   // trenul intră după poartă
    // pământenii
    for (const s of SUM) {
      if (t >= s.td) {
        s.fall.pos(t, s.o.position);
        const tau = Math.min(t, s.fall.tImpact) - s.td;
        s.o.quaternion.copy(s.qd).multiply(spinQ.setFromAxisAngle(s.fall.axis, s.fall.spin * 0.6 * tau));
        setFlame(s.o, 0);
      } else {
        s.track(t, s.o.position);
        velQuat(s.track, t, s.o.quaternion, s.park, false, 0.8);
        setFlame(s.o, t < s.te ? 0 : motion.speed > 4 ? Math.min(1.2, 0.5 + Math.max(0, motion.aF) / 40) : 0.2);
      }
      s.o.visible = s.o.position.lengthSq() < 4e8;
    }
  }

  // ---------- capitolele, cu versurile din episodul 1 ----------
  const chapters = [
    { t: 0, title: 'Liniștea', ref: 'ep. 1, rândurile 124–127', verse: `Lionea sta privind la stele,\nObosit să presupună,\nAștepta întrevederea\nÎn angarul de pe lună.`,
      what: 'Racheta lui Lionea stă pe pista din hangarul de reparații, în peretele de vest al șanțului. Flota vine dinspre Marte: două puncte pe cer, la 32 km, care frânează.' },
    { t: 22, title: 'Prima lovitură', ref: 'ep. 1, rândurile 344–347', verse: `"Înțeleg..." Și-n clipa asta\nO explozie uriașă\nZgâlțâi din temelie\nDe construcția trufașă.`,
      what: 'Clopotul trage din orbită în cupolă: o bară de fier de 20 t la 30 km/s. Primarul moare sub coloană.' },
    { t: 34, title: 'Lamele pleacă', ref: 'ep. 1, rândurile 454–457', verse: `Cât putea cuprinde ochiul,\nUnde-și aruncau privirea,\nPeste tot erau doar nave\nCare le urzeau pieirea.`,
      what: 'Din fiecare dreadnought se desprind 96 de Lame, cu crucea de lumină pe burtă. La 0:44 crucișătoarele se desprind de Brâu.' },
    { t: 60, title: 'Hienele de la intrare', ref: 'ep. 1, rândurile 489–492', verse: `Navele mai ușurele\nSe grupară la intrare,\nNelăsând nici cea mai mică\nȘansă de evacuare.`,
      what: 'Nucleul greu bate cupola, Lamele roiesc în fața gurii bazei. Patru epave încearcă să iasă pe catapulte și cad în șanț.' },
    { t: 95, title: 'Zidul cade', ref: 'ep. 1, rândurile 446–449', verse: `O explozie uriașă\nRidicând de colb un nor,\nDizolvă cu ușurință\nDin perete o bucată,`,
      what: 'Poarta hangarului de reparații sare în bucăți. Trei, doi, unu și pedala.' },
    { t: 101, title: 'Ieșirea', ref: 'ep. 1, rândurile 509–512', verse: `Sprintenă și grațioasă\nNava o zbughi afară,\nCa în următoarea clipă\nS-o străbată o rafală,`,
      what: 'Două Lame ciuruie racheta. Vanea sudează găurile din mers.' },
    { t: 106, title: 'Goana', ref: 'ep. 1, rândurile 519–522', verse: `Trei navete inamice\nSe desprinseră din gloată\nŞi-ncăpăţânat porniră\nGoana după ei îndată.`,
      what: 'Stiopa duce racheta la 60 de metri deasupra colbului, ca pe un camaz.' },
    { t: 119, title: 'Prima', ref: 'ep. 1, rândurile 534–537', verse: `Ciurui cu o rafală\nŞi în urma presiunii,\nUna din nave cu vuiet\nExplodă în colbul lunii.` },
    { t: 124.5, title: 'Două rachete', ref: 'ep. 1, rândurile 539–542', verse: `"Vova, dă două rachete\nÎnspre cea din dreapta navă!"\nVova reperă marcajul\nŞi o transformă-n epavă.` },
    { t: 135, title: 'Stânca', ref: 'ep. 1, rândurile 549–552', verse: `Și viclean, pândind momentul,\nTrase înspre el volanul,\nNava ocolind o stâncă,\nSprinten amăgi dușmanul.` },
    { t: 150, title: 'Baza, baza', ref: 'ep. 1, rândurile 564–567', verse: `"Baza, baza, asta-i Lionea!"\n"Lionea?! Care Lionea, uăi?!"\n"Gura! Fără multă vorbă!\nDacă să trăiești mai vrei,`,
      what: 'Lionea dă planul: navele de război ies primele, transportoarele duc răniții.' },
    { t: 162, title: 'Cuirasatul', ref: 'ep. 1, rândurile 599–602', verse: `Şi zări cuirasatul,\nCe-n a luptei fierbinţeală\nSe desprinse de la grupă,\nFiind ţinta ideală.`,
      what: 'Crucișătorul 1 al primului dreadnought a coborât spre poartă, departe de ai lui. În stoc e o bombă nucleară.' },
    { t: 176, title: 'Încă un soare', ref: 'ep. 1, rândurile 614–617', verse: `Pentru un moment în spaţiu\nApăru încă un soare,\nNava greu lovită-n coastă\nÎncepu lent, să coboare.` },
    { t: 193, title: 'Baza, gazu!', ref: 'ep. 1, rândurile 624–627', verse: `"Baza, gazu! Baza, gazu!"\nUrlând, dădu start furtunii,\nCând răpus leviathanul\nSe tufli în colbul lunii...` },
    { t: 198, title: 'Liliecii', ref: 'ep. 1, rândurile 629–632', verse: `Semănau cu liliecii\nDin a peşterii răcoare,\nCând stârniţi pornesc în stoluri\nAvântându-se spre soare.`,
      what: 'Catapultele aruncă 24 de nave de război, câte 4 pe fiecare. Lamele fac un pas înapoi. De la 3:20, transportoarele pleacă spre Pământ.' },
    { t: 214, title: 'Regruparea', ref: 'ep. 1, rândurile 639–642', verse: `Dar treptat, scăpat de şocul\nLoviturii fără veste,\nRegrupă a sale forţe,\nConcentrând atacul peste` },
    { t: 255, title: 'N-am patroane', ref: 'ep. 1, rândurile 654–657', verse: `"Căpitane, n-am patroane!" -\nVova îi urlă în cască.\nStiopa-i arătă săgeata,\nGata să se prăbuşească,` },
    { t: 262, title: 'Retragerea', ref: 'ep. 1, rândurile 669–672', verse: `"Ultima aeronavă\nE pe drum înspre pământ!"\n"Bun! Retragerea acuma!\nHai, băieţi, înc-un avânt!"...`,
      what: 'Cele 7 nave de război rămase și racheta lui Lionea pleacă spre Pământ.' },
    { t: 280, title: 'Luna captivă', ref: 'ep. 1, rândurile 689–692', verse: `Dar necunoscuta flotă\nRenunţă la ofensivă,\nRetrăgându-se pe luna\nCe-o avea deja captivă...`,
      what: 'Lamele trec în formație, un inel liniștit deasupra bazei.' },
    { t: 300, title: 'Aselenizarea', ref: 'ep. 2, rândurile 26–29', verse: `Câteva minute-n urmă\nPe al lunii relief\nAseleniză la ordin\nCalm, supus dar fără chef`,
      what: 'Dragoș și Elena coboară cu Lama lor pe platforma din fața porții. De aici începe episodul 2.' },
  ];

  // ---------- punctele de vedere ----------
  const domeTop = baza.dome.top;
  const views = [
    { id: 'panorama', name: 'Panorama', type: 'orbit', point: V3(0, 800, 900), dir: V3(-0.42, 0.1, 1), dist: 7200 },
    { id: 'lionea', name: 'Cabina lui Lionea', sum: true, type: 'pov', ent: rocketEnt, anchor: () => rocket.userData.cockpit },
    { id: 'vova', name: 'Turela lui Vova', sum: true, type: 'pov', ent: rocketEnt, anchor: () => rocket.userData.gunner || rocket.userData.cockpit },
    { id: 'racheta', name: 'După rachetă', sum: true, type: 'orbit', ent: rocketEnt, dist: 110 },
    { id: 'dragos', name: 'Lama lui Dragoș', type: 'pov', ent: dragosEnt, anchor: dragosEnt.pov },
    { id: 'puntea', name: 'Puntea dreadnoughtului', type: 'pov', ent: entities[0], anchor: entities[0].pov, fov: 60 },
    { id: 'cuirasat', name: 'Cuirasatul', type: 'orbit', ent: entities[2], dist: 700, dir: V3(-0.6, 0.3, 0.75) },
    { id: 'poarta', name: 'La poartă', sum: true, type: 'free', pos: V3(gm.x + 70, 9, 120), look: V3(-150, 380, 1700) },
    { id: 'baza', name: 'Baza', sum: true, type: 'free', pos: V3(620, 470, 820), look: V3(-120, 60, -60) },
    { id: 'hangar', name: 'Hangarul lui Lionea', sum: true, type: 'free', pos: V3(-700, 16, 515), look: V3(-470, 12, 565) },
    { id: 'cupola', name: 'Pe cupolă', sum: true, type: 'free', pos: domeTop, look: V3(-1500, 2300, 2800) },
    { id: 'pamant', name: 'Dinspre Pământ', sum: true, type: 'free', pos: EARTH_DIR.clone().multiplyScalar(7000).add(V3(1200, -1500, 0)), look: V3(0, 300, 600) },
    { id: 'liber', name: 'Zbor liber', type: 'free' },
  ];

  // ---------- pentru joc: ce doboară Vova și când (aceleași clipe ca în cronologie) ----------
  // shoot: ținta trebuie lovită până la td; lock: marcajul ține pe țintă până pleacă rachetele, la g
  const lamaFn = L => (t, out) => lamaPos(L, t, out);
  const vova = {
    at: vovaAt, rocket, START: 104, END: 262, EMPTY: 255,
    beats: [
      { kind: 'shoot', g: 119, td: 119, pos: lamaFn(chasers[0]), say: 'Primul urmăritor. Ciuruie-l!' },
      { kind: 'lock', g: 124.8, td: 127, pos: lamaFn(chasers[1]), say: '„Vova, dă două rachete înspre cea din dreapta navă!” Ține marcajul pe ea.' },
      { kind: 'shoot', g: 143, td: 143, pos: lamaFn(chasers[2]), say: 'Al treilea a ocolit stânca. Nu-l lăsa!' },
      ...lioneaKills.map((L, i) => ({ kind: 'shoot', g: L.td, td: L.td, pos: lamaFn(L), say: ['Lamele se regrupează. Doboar-o pe cea marcată.', 'Încă una. Caut-o după săgeată.', 'Ultima, până nu se termină patroanele.'][i] })),
    ],
  };

  return { T_END, chapters, views, entities, update, vova };
}

<script>
// ---- mod-joc.js ----
// ---------- Jocul: la puștile lui Vova ----------
// Povestea rămâne cea din cronologie: fiecare doborâre a lui Vova din ep. 1 devine rândul omului. Dacă nu nimerește la timp,
// lupta încetinește și așteaptă în clipa din versuri; ținta cade tot atunci, cu explozia ei. Gloanțele, scânteile și
// marcajul merg pe ceasul real, ca să se poată trage și când timpul luptei stă pe loc.
function modJoc(ctx, L, hooks) {
  const { THREE, scene, V3, camera, glowTex, FX, smooth } = ctx;
  const V = L.vova, $ = id => document.getElementById(id);
  const coarse = matchMedia('(pointer: coarse)').matches;
  const RATE = 12, BULLET = 1400, LIFE = 0.8, HITS = 10, LOCK = 0.8, WIN = 7, WAIT = 12;

  // ---------- interfața ----------
  const css = document.createElement('style');
  css.textContent = `
  body.joc .views, body.joc .track, body.joc #b-speed, body.joc #b-play, body.joc .hint, body.joc #follow, body.joc #tags { display: none !important; }
  body.joc .tl { grid-template-columns: 1fr; justify-items: center; }
  body.joc #stage canvas { cursor: none; }
  .chip.joc-start { border-color: var(--heat); color: var(--heat); }
  #joc { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
  #joc .cross { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; transform: translate(-50%, -50%); }
  #joc .cross::before, #joc .cross::after { content: ""; position: absolute; background: var(--ink); box-shadow: 0 0 3px #000; }
  #joc .cross::before { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
    -webkit-mask: linear-gradient(#000 0 38%, transparent 38% 62%, #000 62%); mask: linear-gradient(#000 0 38%, transparent 38% 62%, #000 62%); }
  #joc .cross::after { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%);
    -webkit-mask: linear-gradient(90deg, #000 0 38%, transparent 38% 62%, #000 62%); mask: linear-gradient(90deg, #000 0 38%, transparent 38% 62%, #000 62%); }
  #joc .cross.on::before, #joc .cross.on::after { background: var(--heat); }
  #joc .mark { position: absolute; width: 46px; height: 46px; transform: translate(-50%, -50%); border: 2px solid var(--heat);
    clip-path: polygon(0 0, 30% 0, 30% 8%, 8% 8%, 8% 30%, 0 30%, 0 70%, 8% 70%, 8% 92%, 30% 92%, 30% 100%, 0 100%,
      100% 100%, 70% 100%, 70% 92%, 92% 92%, 92% 70%, 100% 70%, 100% 30%, 92% 30%, 92% 8%, 70% 8%, 70% 0, 100% 0); }
  #joc .mark.done { border-color: var(--ink-dim); }
  #joc .mark-l { position: absolute; transform: translate(-50%, 0); font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase;
    color: var(--heat); text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #joc .arrow { position: absolute; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent;
    border-bottom: 20px solid var(--heat); transform-origin: 50% 50%; filter: drop-shadow(0 0 3px #000); }
  #joc .top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 6px; align-items: center; pointer-events: auto; }
  #joc .score { font: 600 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); padding: 8px 11px; }
  #joc .score b { color: var(--heat); }
  #joc .msg { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); text-align: center;
    font: 600 20px/1.25 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); text-shadow: 0 1px 4px #000, 0 0 12px #000;
    transition: opacity .4s; text-wrap: balance; }
  #joc .slow { position: absolute; left: 50%; top: calc(50% + 44px); transform: translateX(-50%); font: 600 13px/1 var(--display);
    letter-spacing: .18em; text-transform: uppercase; color: var(--heat); text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #joc .fire { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
    width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--heat); background: rgba(255, 138, 74, .18); color: var(--heat);
    font: 600 18px/1 var(--display); letter-spacing: .12em; pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; }
  #joc .fire:active { background: rgba(255, 138, 74, .4); }
  #joc .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 18px 18px 16px;
    display: grid; gap: 10px; pointer-events: auto; }
  #joc .card h2 { margin: 0; font: 600 26px/1.05 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  #joc .card h2 span { color: var(--heat); }
  #joc .card p { margin: 0; font: 13px/1.55 var(--mono); color: var(--ink-dim); }
  #joc .card p.verse { font-style: italic; color: var(--ink); white-space: pre-line; }
  #joc .card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  #joc .card .row .chip:first-child { border-color: var(--heat); color: var(--heat); }
  #joc button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (max-width: 640px) { #joc .top { top: calc(env(safe-area-inset-top, 0px) + 70px); } #joc .msg { font-size: 16px; top: 58%; } #joc .card h2 { font-size: 22px; } }
  `;
  document.head.appendChild(css);
  const root = document.createElement('div');
  root.id = 'joc';
  root.hidden = true;
  root.innerHTML = `
    <div class="cross" id="j-cross"></div>
    <div class="mark" id="j-mark" hidden></div><div class="mark-l" id="j-mark-l" hidden></div>
    <div class="arrow" id="j-arrow" hidden></div>
    <div class="slow" id="j-slow" hidden>Timpul te așteaptă</div>
    <div class="msg" id="j-msg"></div>
    <div class="top"><span class="score" id="j-score"></span>
      <button type="button" class="chip" id="j-pause">Pauză</button><button type="button" class="chip" id="j-exit">Ieși</button></div>
    <button type="button" class="fire" id="j-fire" hidden>Foc</button>
    <div class="card" id="j-card" hidden></div>`;
  document.body.appendChild(root);

  // ---------- gloanțele și scânteile, pe ceasul real ----------
  const MAXT = 240;
  const tPos = new Float32Array(MAXT * 6), tCol = new Float32Array(MAXT * 6);
  const tGeo = new THREE.BufferGeometry();
  tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3).setUsage(THREE.DynamicDrawUsage));
  tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3).setUsage(THREE.DynamicDrawUsage));
  const tLines = new THREE.LineSegments(tGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  tLines.frustumCulled = false;
  tLines.visible = false;
  scene.add(tLines);
  const sparks = Array.from({ length: 80 }, () => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.visible = false;
    scene.add(s);
    return s;
  });
  let tracers = [], fx = [];   // fx: { at (secunda reală când apare), p, s, life, col }
  const puff = (p, s, life, col, delay = 0) => { if (fx.length < 400) fx.push({ at: clock + delay, p: p.clone(), s, life, col }); };

  // ---------- starea ----------
  let on = false, ended = false, clock = 0, firing = false, lastShot = -1, gun = 0, msgUntil = 0, idx = 0, emptySaid = false;
  let beats = [];
  const fwd = V3(0, 0, 0), aim = V3(0, 0, 0), tgt = V3(0, 0, 0), tmp = V3(0, 0, 0), mz = V3(0, 0, 0);
  function reset(t0) {   // ce e înainte de t0 a trecut deja (pornirea din mijloc, la test): nu se mai joacă
    beats = V.beats.map(b => ({ ...b, hits: 0, lock: 0, done: b.g < t0, auto: b.g < t0, told: false, wait: 0, burn: 0 }));
    idx = beats.filter(b => b.g < t0).length; ended = false; tracers = []; fx = []; firing = false; emptySaid = false;
  }
  const cur = () => beats[idx] || null;
  const active = (b, t) => b && !b.done && t >= b.g - WIN;
  function say(text, secs = 4) {
    const m = $('j-msg');
    m.textContent = text;
    m.style.opacity = 1;
    msgUntil = clock + secs;
  }
  function score() {
    const n = beats.filter(b => b.done && !b.auto && hooks.getT() >= b.td).length;
    $('j-score').innerHTML = `Doborâte <b>${n}</b> / ${beats.length}`;
  }
  function card(html, buttons) {
    const c = $('j-card');
    c.innerHTML = html + '<div class="row"></div>';
    buttons.forEach(([label, fn]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = label;
      b.addEventListener('click', fn);
      c.querySelector('.row').appendChild(b);
    });
    c.hidden = false;
    c.querySelector('button').focus();
  }
  const hideCard = () => { $('j-card').hidden = true; };

  // ---------- pornire, pauză, ieșire ----------
  function lockPointer() { if (!coarse && cv.requestPointerLock) try { cv.requestPointerLock(); } catch (e) { } }
  const cv = hooks.cv;
  function begin() {
    hideCard();
    lockPointer();
    hooks.setPlaying(true);
    if (hooks.getT() < V.START + 1) say('Urmăritorii vin din spate. Așteaptă-i în cătare.', 5);
  }
  function start(opts = {}) {
    reset(opts.t != null ? opts.t : V.START);
    on = true;
    document.body.classList.add('joc');
    root.hidden = false;
    tLines.visible = true;
    $('j-fire').hidden = !coarse;
    FX.mute.add('vova');
    hooks.setSpeed(1);
    hooks.setT(opts.t != null ? opts.t : V.START);
    hooks.viewVova();
    score();
    if (opts.skipIntro) { hooks.setPlaying(!opts.paused); return; }
    hooks.setPlaying(false);
    card(`<h2>La puștile <span>lui Vova</span></h2>
      <p class="verse">"Vova, dă două rachete\nÎnspre cea din dreapta navă!"</p>
      <p>Stai în turela de pe spinarea rachetei, cu fața spre coadă. Lionea a scăpat din hangar, iar Lamele vin după voi.
      Doboară-le pe cele marcate. Dacă nu reușești la timp, lupta te așteaptă.</p>
      <p>${coarse ? 'Trage cu degetul ca să ochești, ține apăsat pe FOC.' : 'Mausul ochește, clic (sau Space) trage. Rotița apropie. Esc oprește.'}</p>`,
      [['Începe', begin], ['Înapoi la film', stop]]);
  }
  function stop() {
    on = false;
    document.body.classList.remove('joc');
    root.hidden = true;
    tLines.visible = false;
    sparks.forEach(s => { s.visible = false; });
    FX.mute.delete('vova');
    hideCard();
    if (document.pointerLockElement === cv) document.exitPointerLock();
    hooks.viewVova();
  }
  function pause() {
    if (!on || ended) return;
    hooks.setPlaying(false);
    firing = false;
    if (document.pointerLockElement === cv) document.exitPointerLock();
    card('<h2>Pauză</h2><p>Lupta stă pe loc. Racheta e unde ai lăsat-o.</p>', [['Continuă', begin], ['Ieși din joc', stop]]);
  }
  function finish() {
    ended = true;
    hooks.setPlaying(false);
    firing = false;
    if (document.pointerLockElement === cv) document.exitPointerLock();
    const n = beats.filter(b => b.done && !b.auto).length, a = beats.filter(b => b.auto).length;
    card(`<h2>Retragerea</h2>
      <p class="verse">"Bun! Retragerea acuma!\nHai, băieţi, înc-un avânt!"...</p>
      <p>Ai doborât <b style="color:var(--heat)">${n} din ${beats.length}</b>.${a ? (a === 1 ? ' Pe una a doborât-o Vova singur.' : ` Pe ${a} le-a doborât Vova singur.`) : ' Vova n-a avut nimic de adăugat.'}
      Racheta lui Lionea pleacă spre Pământ.</p>`,
      [['Încă o dată', () => start()], ['Privește până la capăt', () => { stop(); hooks.setPlaying(true); }]]);
  }
  $('j-pause').addEventListener('click', pause);
  $('j-exit').addEventListener('click', stop);
  document.addEventListener('pointerlockchange', () => {
    if (on && !ended && document.pointerLockElement !== cv && $('j-card').hidden && hooks.isPlaying()) pause();
  });

  // ---------- comenzile ----------
  addEventListener('mousemove', e => {
    if (!on || document.pointerLockElement !== cv) return;
    const k = 0.0022 * camera.fov / 50;
    hooks.cam.look.yaw = Math.max(-2.8, Math.min(2.8, hooks.cam.look.yaw - e.movementX * k));
    hooks.cam.look.pitch = Math.max(-1.3, Math.min(1.3, hooks.cam.look.pitch - e.movementY * k));
  });
  cv.addEventListener('mousedown', e => {
    if (!on || e.button !== 0 || !$('j-card').hidden) return;
    if (document.pointerLockElement !== cv && !coarse) { lockPointer(); return; }
    firing = true;
  });
  addEventListener('mouseup', e => { if (e.button === 0 && !coarse) firing = false; });
  addEventListener('keydown', e => {
    if (!on) return;
    if (e.code === 'Space') { e.preventDefault(); if ($('j-card').hidden) firing = true; }
    if (e.code === 'KeyP') pause();
  });
  addEventListener('keyup', e => { if (on && e.code === 'Space') firing = false; });
  const fb = $('j-fire');
  fb.addEventListener('pointerdown', e => { e.preventDefault(); firing = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => fb.addEventListener(ev, () => { firing = false; }));

  // ---------- timpul luptei: încetinește înaintea unei clipe nefăcute și stă în ea ----------
  function rate(t) {
    if (!on) return 1;
    const b = cur();
    if (!b || b.done) return 1;
    return 1 - 0.85 * smooth(b.g - 2, b.g - 0.3, t);
  }
  function clamp(t) {
    if (!on) return t;
    const b = cur();
    if (b && !b.done && t > b.g - 0.02) return b.g - 0.02;
    return t;
  }

  // ---------- fiecare cadru ----------
  const W = () => innerWidth, H = () => innerHeight;
  function shoot(t, b) {
    camera.getWorldDirection(fwd);
    aim.copy(camera.position).addScaledVector(fwd, 900);
    const mzs = V.rocket.userData.muzzles;
    if (mzs && mzs.length) { mzs[gun++ % mzs.length].getWorldPosition(mz); }
    else mz.copy(camera.position).add(V3(0, -1, 0));
    tracers.push({ p: mz.clone(), d: aim.clone().sub(mz).normalize(), at: clock });
    if (tracers.length > MAXT) tracers.shift();
    puff(mz, 2.2, 0.06, [1, 0.85, 0.5]);
    if (!active(b, t)) return;
    b.pos(t, tgt);
    tmp.copy(tgt).sub(camera.position);
    const along = tmp.dot(fwd);
    if (along < 0 || along > 3000) return;
    const perp = tmp.addScaledVector(fwd, -along).length();
    if (perp < 8 + along * 0.015) {
      b.hits++;
      puff(tgt.clone().add(V3(Math.random() * 6 - 3, Math.random() * 4 - 2, Math.random() * 6 - 3)), 9, 0.35, [1, 0.9, 0.6], along / BULLET);
      if (b.kind === 'shoot' && b.hits >= HITS) complete(b, t);
    }
  }
  function complete(b, t, auto = false) {
    b.done = true; b.auto = auto;
    if (auto) say('Vova a tras singur. Data viitoare, mai repede!', 4);
    else if (b.kind === 'lock') say('Marcaj prins. Rachetele pleacă!', 3);
    else say(t < b.td - 0.5 ? 'Lovită! Arde…' : 'Doborâtă!', 2.5);
  }
  function onScreen(p, out) {   // proiecția pe ecran; out.z > 1 înseamnă în spate
    out.copy(p).project(camera);
    return out;
  }
  function update(t, dt) {
    if (!on) return;
    clock += dt;
    const b = cur();
    // trecem la clipa următoare după ce a căzut ținta
    if (b && b.done && t >= b.td) { idx++; score(); if (!b.auto && b.kind === 'shoot') say('Doborâtă!', 2); }
    const c = cur();
    if (c && !c.told && t >= c.g - WIN) { c.told = true; say(c.say, 5); }
    // în așteptare: după WAIT secunde reale, trage Vova singur (ca să nu rămână nimeni blocat)
    if (c && !c.done && t >= c.g - 0.05 && hooks.isPlaying() && $('j-card').hidden) {
      c.wait += dt;
      if (c.wait > WAIT) complete(c, t, true);
    }
    // doar pentru test (window.__jocBot = true): cătarea pe țintă și focul ținut apăsat
    if (window.__jocBot && active(c, t)) {
      c.pos(t, tgt);
      const look = hooks.cam.look, base = camera.quaternion.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(look.pitch, look.yaw, 0, 'YXZ')).invert());
      const d = tgt.clone().sub(camera.position).normalize().applyQuaternion(base.invert());
      look.yaw = Math.atan2(-d.x, -d.z); look.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z));
      camera.quaternion.copy(base.invert()).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(look.pitch, look.yaw, 0, 'YXZ')));
      firing = true;
    }
    // marcajul pentru rachete
    camera.getWorldDirection(fwd);
    let onT = false;
    if (active(c, t)) {
      c.pos(t, tgt);
      tmp.copy(tgt).sub(camera.position);
      const along = tmp.dot(fwd), perp = tmp.addScaledVector(fwd, -along).length();
      onT = along > 0 && perp < 8 + along * 0.015;
      if (c.kind === 'lock') {
        c.lock = onT ? c.lock + dt : Math.max(0, c.lock - dt * 0.5);
        if (c.lock >= LOCK) complete(c, t);
      }
    }
    // focul
    if (firing && $('j-card').hidden && hooks.isPlaying()) {
      if (t >= V.EMPTY) {
        if (!emptySaid) { emptySaid = true; say('„Căpitane, n-am patroane!”', 4); }
      } else if (clock - lastShot >= 1 / RATE) { lastShot = clock; shoot(t, c); }
    }
    // ținta arde între lovitură și clipa din versuri
    beats.forEach(bb => {
      if (!bb.done || bb.auto || bb.kind !== 'shoot' || t >= bb.td) return;
      if ((bb.burn += dt) > 0.1) { bb.burn = 0; bb.pos(t, tmp); puff(tmp.add(V3(Math.random() * 8 - 4, Math.random() * 4, Math.random() * 8 - 4)), 7 + Math.random() * 6, 0.5, [1, 0.55, 0.2]); }
    });
    // gloanțele
    let n = 0;
    tracers = tracers.filter(tr => clock - tr.at < LIFE);
    for (const tr of tracers) {
      const age = clock - tr.at, k = 1 - age / LIFE;
      const a = tmp.copy(tr.p).addScaledVector(tr.d, age * BULLET), o = n * 6;
      tPos[o] = a.x; tPos[o + 1] = a.y; tPos[o + 2] = a.z;
      a.addScaledVector(tr.d, -Math.min(30, age * BULLET));
      tPos[o + 3] = a.x; tPos[o + 4] = a.y; tPos[o + 5] = a.z;
      tCol[o] = 1 * k; tCol[o + 1] = 0.9 * k; tCol[o + 2] = 0.55 * k; tCol[o + 3] = 0.2 * k; tCol[o + 4] = 0.15 * k; tCol[o + 5] = 0.1 * k;
      n++;
    }
    tGeo.setDrawRange(0, n * 2);
    tGeo.attributes.position.needsUpdate = true;
    tGeo.attributes.color.needsUpdate = true;
    // scânteile
    fx = fx.filter(f => clock - f.at < f.life);
    let si = 0;
    for (const f of fx) {
      const age = clock - f.at;
      if (age < 0 || si >= sparks.length) continue;
      const s = sparks[si++], u = age / f.life;
      s.visible = true; s.position.copy(f.p); s.scale.setScalar(f.s * (1 + u));
      s.material.color.setRGB(f.col[0], f.col[1], f.col[2]); s.material.opacity = 1 - u;
    }
    for (; si < sparks.length; si++) sparks[si].visible = false;
    // interfața
    $('j-cross').classList.toggle('on', onT);
    $('j-cross').hidden = !$('j-card').hidden;
    $('j-slow').hidden = rate(t) > 0.9;
    if (clock > msgUntil) $('j-msg').style.opacity = 0;
    const mk = $('j-mark'), ml = $('j-mark-l'), ar = $('j-arrow');
    const show = c && t >= c.g - WIN && t < c.td + 0.3;
    mk.hidden = ml.hidden = ar.hidden = true;
    if (show) {
      c.pos(t, tgt);
      const dist = camera.position.distanceTo(tgt);
      onScreen(tgt, tmp);
      const inside = tmp.z < 1 && Math.abs(tmp.x) < 0.95 && Math.abs(tmp.y) < 0.92;
      if (inside) {
        const x = (tmp.x + 1) / 2 * W(), y = (1 - tmp.y) / 2 * H();
        mk.hidden = ml.hidden = false;
        mk.style.left = x + 'px'; mk.style.top = y + 'px';
        mk.classList.toggle('done', c.done);
        ml.style.left = x + 'px'; ml.style.top = (y + 28) + 'px';
        ml.textContent = c.done ? (c.kind === 'lock' ? 'rachete pe drum' : 'arde') : c.kind === 'lock' ? `marcaj ${Math.round(Math.min(1, c.lock / LOCK) * 100)}%` : `${Math.round(dist)} m`;
      } else if (!c.done) {
        // săgeata pe marginea ecranului, spre țintă
        let x = tmp.x, y = tmp.y;
        if (tmp.z > 1) { x = -x; y = -y; }
        const ang = Math.atan2(y, x), r = Math.min(W(), H()) * 0.5 - 40;
        ar.hidden = false;
        ar.style.left = (W() / 2 + Math.cos(ang) * r - 11) + 'px';
        ar.style.top = (H() / 2 - Math.sin(ang) * r - 10) + 'px';
        ar.style.transform = `rotate(${Math.PI / 2 - ang}rad)`;
      }
    }
    if (t >= V.END && !ended) finish();
    if (window.__jocDbg) window.__jocDbg = { t, idx, beats: beats.map(x => ({ kind: x.kind, g: x.g, done: x.done, auto: x.auto, hits: x.hits, lock: +x.lock.toFixed(2) })), rate: rate(t) };
  }

  return { get on() { return on; }, start, stop, rate, clamp, update };
}

    const s = document.createElement('small');
    s.textContent = (dead ? `doborât${cam.ent.fem ? 'ă' : ''} la ${fmt(cam.ent.deadAt)}. ` : '') + (cam.ent.note || '');
    f.appendChild(s);
    if (cam.ent.pov && cam.mode === 'orbit') {
      const p = document.createElement('button');
      p.type = 'button'; p.className = 'chip'; p.textContent = 'Intră în cabină'; p.style.marginTop = '8px';
      p.addEventListener('click', () => setView({ type: 'pov', ent: cam.ent, anchor: cam.ent.pov }, null));
      f.appendChild(p);
    }
  }
  L.views.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (v.sum ? ' sum' : ''); b.textContent = v.name;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => setView(v, b));
    $('views').appendChild(b);
    viewBtns.push(b);
  });
  // jocul: la puștile lui Vova (mod-joc.js); ?joc=1 îl pornește direct, fără prezentare (pentru capturile de test)
  const vovaView = L.views.find(v => v.id === 'vova');
  const game = modJoc(ctx, L, {
    cv: renderer.domElement, cam, getT: () => t, setT: v => { t = v; }, isPlaying: () => playing,
    setPlaying: v => { playing = v; syncPlay(); },
    setSpeed: v => { speed = v; $('b-speed').textContent = v + '×'; },
    viewVova: () => setView(vovaView, viewBtns[L.views.indexOf(vovaView)]),
  });
  {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip joc-start'; b.textContent = 'Joacă: Vova';
    b.addEventListener('click', () => game.start());
    $('views').prepend(b);
  }
  // VR: butonul apare doar unde browserul știe VR (casca); intri în turela lui Vova, din 1:35 dacă erai mai devreme.
  // În cască: trăgaciul schimbă cabina (Lionea, Vova, Dragoș, puntea), butonul de pe mâner pune pauză.
  const povViews = L.views.filter(v => v.type === 'pov');
  function vrView(v) { setView(v, viewBtns[L.views.indexOf(v)]); }
  if (navigator.xr) navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    if (!ok) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip sum'; b.textContent = 'Intră în VR';
    b.addEventListener('click', async () => {
      const s = renderer.xr.getSession();
      if (s) { s.end(); return; }
      const session = await navigator.xr.requestSession('immersive-vr');
      session.addEventListener('end', () => { b.textContent = 'Intră în VR'; });
      if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
      await renderer.xr.setSession(session);
      b.textContent = 'Ieși din VR';
      vrView(vovaView);
      if (t < 95 || t >= T_END) t = 95;
      playing = true; syncPlay();
    });
    $('views').prepend(b);
  }).catch(() => {});
  [0, 1].forEach(i => {
    const c = renderer.xr.getController(i);
    c.addEventListener('select', () => {
      const k = povViews.findIndex(v => cam.mode === 'pov' && v.anchor() === cam.anchor);
      vrView(povViews[(k + 1) % povViews.length]);
    });
    c.addEventListener('squeeze', () => { playing = !playing; syncPlay(); });
  });

  // tragerea cu mausul: în cabină și în zborul liber rotește privirea; un clic scurt alege nava
  let drag = null;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => { if (document.pointerLockElement === cv) return; drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, id: e.pointerId }; });
  addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (cam.mode === 'free') {
      cam.yaw -= dx * 0.0035; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch - dy * 0.0035));
    } else if (cam.mode === 'pov') {
      cam.look.yaw = Math.max(-2.8, Math.min(2.8, cam.look.yaw - dx * 0.004));
      cam.look.pitch = Math.max(-1.3, Math.min(1.3, cam.look.pitch - dy * 0.004));
    }
  });
  addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
    drag = null;
    if (moved > 6 || e.target !== cv || game.on) return;
    // alege nava cea mai apropiată de clic, pe ecran
    const r = cv.getBoundingClientRect();
    let best = null, bd = 34;
    for (const en of L.entities) {
      if (en.hidden && en.hidden(t)) continue;
      en.pos(t, tmpV);
      const dist = camera.position.distanceTo(tmpV);
      if (dist < 1) continue;
      tmpV.project(camera);
      if (tmpV.z > 1 || tmpV.z < -1) continue;
      const sx = (tmpV.x + 1) / 2 * r.width, sy = (1 - tmpV.y) / 2 * r.height;
      const d = Math.hypot(sx - (e.clientX - r.left), sy - (e.clientY - r.top)) - (en.big ? 20 : 0);
      if (d < bd) { bd = d; best = en; }
    }
    if (best) follow(best);
  });
  cv.addEventListener('dblclick', () => { cam.look.yaw = cam.look.pitch = 0; });
  cv.addEventListener('wheel', e => {
    if (cam.mode === 'free') { cam.speed = Math.max(10, Math.min(20000, cam.speed * (e.deltaY > 0 ? 0.8 : 1.25))); e.preventDefault(); }
    else if (cam.mode === 'pov') { camera.fov = Math.max(15, Math.min(80, camera.fov + (e.deltaY > 0 ? 3 : -3))); camera.updateProjectionMatrix(); e.preventDefault(); }
  }, { passive: false });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (game.on) return;
    if (e.code === 'Space' && cam.mode !== 'free') { e.preventDefault(); $('b-play').click(); return; }
    cam.keys[e.code] = true;
  });
  addEventListener('keyup', e => { cam.keys[e.code] = false; });
  [['p-fwd', 'KeyW'], ['p-back', 'KeyS']].forEach(([id, code]) => {
    $(id).addEventListener('pointerdown', e => { e.preventDefault(); cam.keys[code] = true; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $(id).addEventListener(ev, () => { cam.keys[code] = false; }));
  });

  function updateCamera(dt) {
    if (cam.mode === 'orbit') {
      if (cam.ent) {
        cam.ent.pos(t, tmpV);
        const delta = tmpV.clone().sub(lastTarget);
        camera.position.add(delta);
        controls.target.add(delta);
        lastTarget.copy(tmpV);
      }
      controls.update();
    } else if (cam.mode === 'pov') {
      const a = cam.anchor;
      a.updateWorldMatrix(true, false);
      a.matrixWorld.decompose(camera.position, tmpQ, tmpV);
      camera.quaternion.copy(tmpQ).multiply(QFIX);
      camera.quaternion.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(cam.look.pitch, cam.look.yaw, 0, 'YXZ')));
    } else {
      camera.quaternion.setFromEuler(tmpE.set(cam.pitch, cam.yaw, 0, 'YXZ'));
      const k = cam.keys, sp = cam.speed * (k.ShiftLeft || k.ShiftRight ? 6 : 1) * dt;
      const fwd = V3(0, 0, -1).applyQuaternion(camera.quaternion), right = V3(1, 0, 0).applyQuaternion(camera.quaternion);
      if (k.KeyW || k.ArrowUp) camera.position.addScaledVector(fwd, sp);
      if (k.KeyS || k.ArrowDown) camera.position.addScaledVector(fwd, -sp);
      if (k.KeyD || k.ArrowRight) camera.position.addScaledVector(right, sp);
      if (k.KeyA || k.ArrowLeft) camera.position.addScaledVector(right, -sp);
      if (k.KeyR || k.KeyE) camera.position.y += sp;
      if (k.KeyF || k.KeyQ) camera.position.y -= sp;
      const g = terrainH(camera.position.x, camera.position.z) + 2;
      if (camera.position.y < g && !ctx.baza.inside(camera.position)) camera.position.y = g;   // în tunel și în hangar se poate intra
    }
    if (FX.shake > 0 && !reduceMotion && !renderer.xr.isPresenting) camera.position.add(V3((Math.random() - 0.5) * FX.shake, (Math.random() - 0.5) * FX.shake, (Math.random() - 0.5) * FX.shake));
  }

  // ---------- etichetele ----------
  const tagEls = L.entities.filter(e => e.label).map(e => {
    const d = document.createElement('div');
    d.className = 'tag' + (e.sum ? ' sum' : '');
    d.textContent = e.label;
    $('tags').appendChild(d);
    return { e, d };
  });
  function updateTags() {
    const w = stage.clientWidth, h = stage.clientHeight;
    for (const { e, d } of tagEls) {
      if ((e.hidden && e.hidden(t)) || e === cam.ent && cam.mode === 'pov') { d.hidden = true; continue; }
      e.pos(t, tmpV);
      const dist = camera.position.distanceTo(tmpV);
      tmpV.y += e.radius * 0.6;
      tmpV.project(camera);
      if (tmpV.z > 1 || dist > (e.big ? 40000 : 9000)) { d.hidden = true; continue; }
      d.hidden = false;
      d.style.left = ((tmpV.x + 1) / 2 * w) + 'px';
      d.style.top = ((1 - tmpV.y) / 2 * h) + 'px';
      d.classList.toggle('dead', e.deadAt != null && t >= e.deadAt);
    }
  }

  // ---------- bucla ----------
  const startView = L.views.find(v => v.id === (Q.get('view') || 'panorama')) || L.views[0];
  setView(startView, viewBtns[L.views.indexOf(startView)]);
  if (Q.has('cam')) setView({ type: 'free', pos: V3(...Q.get('cam').split(',').map(Number)), look: V3(...Q.get('look').split(',').map(Number)) }, null);
  syncPlay();
  if (Q.has('joaca')) game.start();   // pagina „Joacă: Vova” pornește direct cu prezentarea jocului
  if (Q.has('joc')) { window.__jocDbg = {}; game.start({ t: Q.has('t') ? +Q.get('t') : undefined, skipIntro: true, paused: Q.has('paused') }); }
  $('status').hidden = true;
  let last = performance.now(), followTick = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (playing) {
      t = game.clamp(t + dt * speed * game.rate(t));
      if (t >= T_END) { t = T_END; playing = false; syncPlay(); }
    }
    L.update(t);
    ctx.baza.update(t);
    updateCamera(dt);
    game.update(t, dt);
    FX.update(t, camera.position);
    renderer.toneMappingExposure = FX.exposure;
    $('scrub').value = t;
    $('clock').textContent = `${fmt(t)} / ${fmt(T_END)}`;
    syncChapter();
    if ((followTick += dt) > 0.5) { followTick = 0; syncFollow(); }
    updateTags();
    renderer.info.autoReset = false;   // două scene pe cadru: contorul se golește o dată, la începutul cadrului
    renderer.info.reset();
    renderer.clear();
    let view = camera;
    if (renderer.xr.isPresenting) {   // în cabină scaunul se înclină cu nava; în rest stă drept (doar rotit), ca să nu amețești
      rig.position.copy(camera.position);
      if (cam.mode === 'pov') rig.quaternion.copy(camera.quaternion);
      else rig.quaternion.setFromEuler(rigE.set(0, rigE.setFromQuaternion(camera.quaternion, 'YXZ').y, 0, 'YXZ'));
      rig.updateMatrixWorld(true);
      view = xrCam;
    }
    renderer.render(sceneIn, view);
    renderer.render(sceneOut, view);
    if (Q.has('stats') && !window.__stats) {   // test: câte triunghiuri și apeluri de desen are cadrul
      const i = renderer.info.render;
      window.__stats = true;
      console.log('STATS ' + JSON.stringify({ calls: i.calls, triangles: i.triangles, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures }));
    }
  }
  renderer.setAnimationLoop(frame);   // ca requestAnimationFrame, dar merge și în cască (acolo cadrele le dă casca)
})();
</script>
