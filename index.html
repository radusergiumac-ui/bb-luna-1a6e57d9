<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Bătălia de pe Lună</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: lupta 3D pe tot ecranul; capitolul cu versurile în stânga sus, punctele de vedere și cronologia jos. Un singur look, întunecat. */
  :root {
    --void: #050608;
    --ink: #f1e4cc;
    --ink-dim: #b0a088;
    --panel: rgba(12, 11, 12, 0.8);
    --line: rgba(241, 228, 204, 0.16);
    --gold: #d9b45a;      /* Titanul */
    --sum: #7fb2e6;       /* pământenii */
    --heat: #ff8a4a;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--void); color: var(--ink); overflow: hidden; font-family: var(--mono); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.flying { cursor: crosshair; }
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; transform: translate(-50%, -100%); font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase;
    white-space: nowrap; padding: 3px 6px 4px; border-bottom: 1px solid currentColor; color: var(--gold); text-shadow: 0 1px 3px #000; }
  .tag.sum { color: var(--sum); }
  .tag.dead { opacity: .45; text-decoration: line-through; }

  .chapter { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px));
    width: min(360px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .chapter summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .chapter summary::-webkit-details-marker { display: none; }
  .chapter summary:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .chapter h1 { margin: 0; font: 600 22px/1.05 var(--display); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
  .chapter h1 span { color: var(--heat); }
  .chapter summary small { font: 500 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
  .chapter[open] summary small::after { content: " ▴"; }
  .chapter:not([open]) summary small::after { content: " ▾"; }
  .ch-body { display: grid; gap: 10px; padding: 0 14px 14px; }
  .verse { margin: 0; font: italic 13px/1.55 var(--mono); white-space: pre-line; color: var(--ink); }
  .ref { margin: 0; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .what { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-dim); }

  .follow { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px));
    max-width: min(300px, calc(100vw - 32px)); padding: 9px 12px; background: var(--panel); border: 1px solid var(--line);
    font: 500 14px/1.25 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .follow b { color: var(--gold); font-weight: 600; }
  .follow small { display: block; font: 11px/1.4 var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-dim); margin-top: 3px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 8px;
    padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, rgba(5, 6, 8, .92), rgba(5, 6, 8, 0)); }
  .views { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .views::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); padding: 8px 11px; cursor: pointer; }
  .chip:hover { border-color: var(--ink-dim); }
  .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .chip.sum[aria-pressed="true"] { border-color: var(--sum); color: var(--sum); }
  .chip:focus-visible, .tl button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .tl { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; }
  .tl button { font: 600 14px/1 var(--display); letter-spacing: .08em; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    padding: 8px 10px; min-width: 40px; cursor: pointer; }
  .clock { font: 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-dim); min-width: 92px; }
  .track { position: relative; min-width: 0; height: 30px; }
  .track input { position: absolute; inset: 9px 0 auto; width: 100%; margin: 0; accent-color: var(--heat); }
  .ticks { position: absolute; inset: 0 0 auto; height: 8px; }
  .ticks button { position: absolute; top: 0; width: 9px; height: 9px; min-width: 0; padding: 0; transform: translateX(-50%) rotate(45deg);
    background: var(--ink-dim); border: 0; cursor: pointer; }
  .ticks button.on { background: var(--heat); }
  .hint { margin: 0; font-size: 10.5px; color: var(--ink-dim); text-align: center; }
  .pad { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); display: grid; gap: 8px; }
  .pad button { width: 52px; height: 52px; font: 600 18px/1 var(--display); color: var(--ink); background: var(--panel); border: 1px solid var(--line); touch-action: none; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 16px/1 var(--display);
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }
  @media (max-width: 640px) {
    .chapter h1 { font-size: 19px; }
    .verse { font-size: 12px; }
    .follow { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); right: auto; left: max(16px, env(safe-area-inset-left, 0px)); }
    .clock { min-width: 0; }
    .hint { display: none; }
  }
</style>

<div id="stage"></div>
<div id="tags"></div>
<div id="status">Se ridică Luna…</div>

<details class="chapter" id="chapter" open>
  <summary><h1 id="ch-title">Bătălia de pe Lună</h1><small id="ch-time">ep. 1</small></summary>
  <div class="ch-body">
    <p class="verse" id="ch-verse"></p>
    <p class="ref" id="ch-ref"></p>
    <p class="what" id="ch-what"></p>
  </div>
</details>
<div class="follow" id="follow" hidden></div>
<div class="pad" id="pad" hidden>
  <button type="button" id="p-fwd" aria-label="Înainte">▲</button>
  <button type="button" id="p-back" aria-label="Înapoi">▼</button>
</div>

<div class="bar">
  <div class="views" id="views"></div>
  <div class="tl">
    <button type="button" id="b-play" aria-label="Pauză">❚❚</button>
    <span class="clock" id="clock">0:00 / 5:30</span>
    <div class="track"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" max="330" step="0.1" value="0" aria-label="Momentul luptei"></div>
    <button type="button" id="b-speed" aria-label="Viteza">1×</button>
  </div>
  <p class="hint" id="hint">Clic pe orice navă ca s-o urmărești · trage ca să rotești · „Zbor liber”: W A S D, R / F sus-jos, Shift mai repede, rotița schimbă viteza</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---- mod-flota.js ----
// ---------- Flota de pe Titan: dreadnoughtul-cruce, crucișătorul, Lama ----------
// Aceeași geometrie ca în scripts/dreadnought3d/dreadnought.html (decisă de autor pe 24 oct.), scoasă în constructori,
// ca să pună lupta mai multe nave. Fără flacăra fuziunii (lângă Lună e oprită) și fără celulele din Brâu (închise).
// Unitatea e metrul. Axa navei e y: vârful sus. Originea grupului întors e mijlocul navei (y = 416 în coordonatele modelului).
function modFlota(ctx) {
  const { THREE, rng, canvasTex, glowTex, LAMA } = ctx;
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const UP = V3(0, 1, 0), ZA = V3(0, 0, 1);
  const CY = 416;

  function plumeTex(c0, c1) {   // fără repetare, altfel capătul se aprinde ca un inel
    const t = canvasTex(4, 512, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, c0); gr.addColorStop(0.18, c1); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    });
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    return t;
  }
  function winTex(seed, cols, lit, gy = 12) {   // ferestrele din miez: candele, nu neon
    const r = rng(seed);
    return canvasTex(1024, 256, (g, w, h) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
      for (let y = 4; y < h - 4; y += gy) for (let x = 2; x < w - 8; x += 10) {
        if (r() > lit) continue;
        g.globalAlpha = 0.5 + r() * 0.5;
        g.fillStyle = cols[(r() * cols.length) | 0];
        g.fillRect(x, y, 6, 4);
      }
    });
  }
  const radTex = canvasTex(256, 64, (g, w, h) => {
    g.fillStyle = '#1e0302'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 8) {
      g.fillStyle = `rgba(200, ${30 + (x * 7) % 30}, 14, ${0.35 + ((x * 13) % 30) / 100})`;
      g.fillRect(x + 2, 3, 4, h - 6);
    }
    g.fillStyle = '#a8441a'; g.fillRect(0, 0, w, 3); g.fillRect(0, h - 3, w, 3);
  });

  // materiale: negru mat și aur, ca la Lama
  const M = {
    hull: new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.8, metalness: 0.25 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x0f0e11, roughness: 0.7, metalness: 0.35 }),
    steel: new THREE.MeshStandardMaterial({ color: 0x26282c, roughness: 0.6, metalness: 0.45 }),
    shelf: new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.6, metalness: 0.45 }),
    gold: new THREE.MeshStandardMaterial({ color: 0xc9a04a, roughness: 0.32, metalness: 0.55, emissive: 0x3a2808, emissiveIntensity: 0.8 }),
    rim: new THREE.MeshStandardMaterial({ color: 0x8a6a2a, roughness: 0.4, metalness: 0.5, emissive: 0x8a6420, emissiveIntensity: 1.2 }),
    copper: new THREE.MeshStandardMaterial({ color: 0xa8673a, roughness: 0.4, metalness: 0.55, emissive: 0x2a1004 }),
    tank: new THREE.MeshStandardMaterial({ color: 0x1c1b1f, roughness: 0.75, metalness: 0.3 }),
    nozzle: new THREE.MeshStandardMaterial({ color: 0x2a2b2f, roughness: 0.5, metalness: 0.5, side: THREE.DoubleSide }),
    ice: new THREE.MeshStandardMaterial({ color: 0x5f7584, roughness: 0.32, metalness: 0, emissive: 0x0e1c26, emissiveIntensity: 0.6, flatShading: true, side: THREE.DoubleSide }),
    rad: new THREE.MeshStandardMaterial({ color: 0x120605, roughness: 0.7, metalness: 0.2, emissive: 0x6e0c05, emissiveMap: radTex, emissiveIntensity: 1 }),
    plasma: new THREE.MeshBasicMaterial({ color: 0xffd8a0 }),
    lampWarm: new THREE.MeshBasicMaterial({ color: 0xffc98a }),
    gun: new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.45, metalness: 0.55 }),
    sign: new THREE.MeshStandardMaterial({ color: 0xc9a04a, roughness: 0.3, metalness: 0.55, emissive: 0xffc860, emissiveIntensity: 0.25 }),
    greeb: new THREE.MeshStandardMaterial({ color: 0x151418, roughness: 0.75, metalness: 0.3 }),
  };
  const coreMat = tex => new THREE.MeshStandardMaterial({ color: 0x17161b, roughness: 0.6, metalness: 0.4, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 1.1 });
  const frunteMat = coreMat(winTex(3, ['#ffcf8a', '#ffe2b0', '#ffd9a8'], 0.4));
  const capelaMat = coreMat(winTex(11, ['#ffcf8a', '#ffe2b0'], 0.55, 16));
  const manPlumeMat = new THREE.MeshBasicMaterial({ map: plumeTex('rgba(240,244,255,1)', 'rgba(110,150,255,.6)'), transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const radial = phi => V3(Math.cos(phi), 0, -Math.sin(phi));

  function tools(parent) {
    const mesh = (geo, mat, x = 0, y = 0, z = 0, p = parent) => {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      p.add(m);
      return m;
    };
    const ring = (r, tube, y, mat, p = parent) => {
      const m = mesh(new THREE.TorusGeometry(r, tube, 8, 96), mat, 0, y, 0, p);
      m.rotation.x = Math.PI / 2;
      return m;
    };
    const cyl = (rt, rb, h, y, mat, seg = 64, open = false) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat, 0, y, 0);
    const bars = [];
    const bar = (a, b, t) => {
      const d = new THREE.Vector3().subVectors(b, a), len = d.length();
      const q = new THREE.Quaternion().setFromUnitVectors(UP, d.normalize());
      bars.push(new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(0.5), q, V3(t, len, t)));
    };
    const instanced = (geo, mat, mats, p = parent) => {
      const im = new THREE.InstancedMesh(geo, mat, Math.max(1, mats.length));
      mats.forEach((m, i) => im.setMatrixAt(i, m));
      im.count = mats.length;
      p.add(im);
      return im;
    };
    return { mesh, ring, cyl, bars, bar, instanced };
  }

  // ---------- crucișătorul: 253 m, 5 turele duble, 3 motoare ----------
  // Local, exteriorul (spatele turnului de comandă) e +z; fața dinspre dreadnought e -z. Originea: mijlocul corpului.
  const CRY = 418;
  function makeCruiser(seed) {
    const root = new THREE.Group();
    const g = new THREE.Group();
    g.position.y = -CRY;
    root.add(g);
    const { mesh, instanced } = tools(g);
    const HEX = Math.PI / 6;
    const hex = (rt, rb, y0, y1, mat) => mesh(new THREE.CylinderGeometry(rt, rb, y1 - y0, 6, 1, false, HEX), mat, 0, (y0 + y1) / 2, 0);
    hex(11, 15, 318, 340, M.dark);
    hex(15, 15, 340, 470, M.hull);
    hex(15.8, 15.8, 352, 368, M.gun);
    hex(15.8, 15.8, 420, 436, M.gun);
    hex(15.3, 15.3, 380, 380.8, M.gold);
    hex(15.3, 15.3, 455, 455.8, M.gold);
    hex(11, 15, 470, 500, M.hull);
    hex(1.2, 11, 500, 545, M.hull).scale.set(0.42, 1, 1.25);
    const gb = [], rr = rng(seed), ap = 15 * Math.cos(Math.PI / 6);
    for (let i = 0; i < 160; i++) {
      const th = ((rr() * 6) | 0) * Math.PI / 3, y = 342 + rr() * 126, dd = 0.3 + rr() * 0.8;
      const n = V3(Math.sin(th), 0, Math.cos(th)), tg = V3(Math.cos(th), 0, -Math.sin(th));
      const pp = n.clone().multiplyScalar(ap + dd / 2).addScaledVector(tg, (rr() - 0.5) * 11).setY(y);
      gb.push(new THREE.Matrix4().compose(pp, new THREE.Quaternion().setFromAxisAngle(UP, th), V3(1 + rr() * 5, 1 + rr() * 9, dd)));
    }
    instanced(unitBox, M.greeb, gb);
    mesh(new THREE.BoxGeometry(10, 40, 9), M.hull, 0, 405, ap + 4.5);
    mesh(new THREE.BoxGeometry(18, 9, 14), M.hull, 0, 428, ap + 9);
    mesh(new THREE.BoxGeometry(16, 1.2, 0.3), M.lampWarm, 0, 429, ap + 16.1);
    const muzzles = [];
    [[0, 445], [Math.PI / 3, 385], [-Math.PI / 3, 385], [Math.PI / 3, 458], [-Math.PI / 3, 458]].forEach(([th, y]) => {
      const n = V3(Math.sin(th), 0, Math.cos(th)), tg = V3(Math.cos(th), 0, -Math.sin(th));
      const b = mesh(new THREE.BoxGeometry(8, 6, 5), M.gun);
      b.position.copy(n).multiplyScalar(ap + 2.5).setY(y);
      b.rotation.y = th;
      [-1.8, 1.8].forEach(o => {
        const pp = n.clone().multiplyScalar(ap + 3).addScaledVector(tg, o).setY(y + 11);
        mesh(new THREE.CylinderGeometry(0.8, 0.8, 18, 10), M.gun, pp.x, pp.y, pp.z);
        muzzles.push(pp.clone().setY(y + 20 - CRY));
      });
    });
    const plumes = [];
    [0, 2, 4].forEach(k => {
      const th = k * Math.PI / 3, n = V3(Math.sin(th), 0, Math.cos(th)), c = n.clone().multiplyScalar(27);
      mesh(new THREE.CylinderGeometry(5.5, 6.5, 52, 8), M.hull, c.x, 326, c.z).rotation.y = th;
      mesh(new THREE.LatheGeometry([[7.5, 292], [6.5, 297], [5, 300]].map(([q, y]) => new THREE.Vector2(q, y)), 24), M.nozzle, c.x, 0, c.z);
      mesh(new THREE.TorusGeometry(4.6, 0.6, 8, 32), M.plasma, c.x, 298, c.z).rotation.x = Math.PI / 2;
      [[350, 336], [330, 318]].forEach(([y0, y1]) => {
        const a = n.clone().multiplyScalar(12).setY(y0), b = c.clone().setY(y1), v = new THREE.Vector3().subVectors(b, a);
        const m = mesh(new THREE.BoxGeometry(3.5, v.length(), 8), M.dark);
        m.position.copy(a).add(b).multiplyScalar(0.5);
        m.quaternion.setFromUnitVectors(UP, v.normalize());
      });
      const pl = mesh(new THREE.CylinderGeometry(5, 16, 90, 20, 1, true), manPlumeMat, c.x, 292 - 45, c.z);
      pl.rotation.x = Math.PI;
      plumes.push(pl);
    });
    [380, 450].forEach(y => mesh(new THREE.BoxGeometry(12, 12, 3), M.steel, 0, y, -(ap + 1.5)));
    root.userData = { len: 253, muzzles, plumes };
    return root;
  }

  // ---------- Lama: decodată din geometria simplificată (TRELLIS.2), 25 m, botul spre +x, burta spre -y ----------
  const lamaGeo = (() => {
    const b64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
    const q = new Uint16Array(b64(LAMA.pos)), col = new Uint8Array(b64(LAMA.col)), idx = new Uint16Array(b64(LAMA.idx));
    const lo = LAMA.bmin, hi = LAMA.bmax, s = 25 / (hi[0] - lo[0]);
    const P = new Float32Array(LAMA.n * 3), Cl = new Float32Array(LAMA.n * 3);
    for (let i = 0; i < LAMA.n; i++) for (let a = 0; a < 3; a++) {
      P[i * 3 + a] = (lo[a] + q[i * 3 + a] / 65535 * (hi[a] - lo[a]) - (lo[a] + hi[a]) / 2) * s;
      Cl[i * 3 + a] = 0.09 + Math.pow(col[i * 3 + a] / 255, 2.2) * 1.6;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P, 3));
    g.setAttribute('color', new THREE.BufferAttribute(Cl, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    return g;
  })();
  const lamaMat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.5, metalness: 0.35 });
  // Apariția Lamei: crucea de lumină pe burtă
  const crossTex = canvasTex(256, 256, (g, w) => {
    g.translate(w / 2, w / 2);
    g.rotate(Math.PI / 2);
    g.shadowColor = 'rgba(255,214,140,1)'; g.shadowBlur = 22; g.fillStyle = 'rgba(255,248,226,1)';
    g.fillRect(-6, -100, 12, 200);
    g.fillRect(-62, -46, 124, 12);
    g.fillRect(-30, -78, 60, 10);
    g.save(); g.translate(0, 56); g.rotate(-0.35); g.fillRect(-42, -5, 84, 10); g.restore();
  });
  const crossGeo = new THREE.PlaneGeometry(30, 30); crossGeo.rotateX(Math.PI / 2); crossGeo.translate(0, -2.9, 0);
  const crossMat = new THREE.MeshBasicMaterial({ map: crossTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

  // ---------- dreadnoughtul ----------
  // Întoarce { group, docks, muzzle, silos, cruiserMounts, manPlumes }. docks: unde atârnă cele 144 de Lame (în coordonatele grupului).
  function makeDreadnought(seed) {
    const rnd = rng(seed);
    const pivot = new THREE.Group();
    const ship = new THREE.Group();
    ship.position.y = -CY;
    pivot.add(ship);
    const { mesh, ring, cyl, bars, bar, instanced } = tools(ship);

    // coloana de zăbrele
    {
      const corners = [[9, 9], [-9, 9], [-9, -9], [9, -9]];
      corners.forEach(([x, z]) => bar(V3(x, 140, z), V3(x, 700, z), 2.2));
      for (let y = 140; y < 700; y += 20) for (let i = 0; i < 4; i++) {
        const [x1, z1] = corners[i], [x2, z2] = corners[(i + 1) % 4];
        bar(V3(x1, y, z1), V3(x2, y, z2), 1.2);
        bar(V3(x1, y, z1), V3(x2, y + 20, z2), 0.8);
      }
    }

<script>
// ---- mod-pamanteni.js ----
// ---------- Navele Statelor Unite ale Moldovei (episodul 1) ----------
// Tehnică retro, sovietică: racheta de film vechi și camazul. Alb-gri murdar, rugină, petice sudate de Vanea,
// banda tricoloră. Contrastul total cu flota de pe Titan (negru mat și aur).
// Toate navele au botul spre +y local, originea în centru, „sus”-ul (cabina, turela) spre +z local.
// Piesele cu același material se lipesc într-o singură geometrie: puține mesh-uri pe navă.
function modPamanteni(ctx) {
  const { THREE, rng, canvasTex, glowTex } = ctx;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const PI = Math.PI;

  // ---------- unelte ----------
  const T = (geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) =>
    geo.applyMatrix4(new THREE.Matrix4().compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V(sx, sy, sz)));
  const uvs = (geo, su, sv) => { const u = geo.attributes.uv; for (let i = 0; i < u.count; i++) u.setXY(i, u.getX(i) * su, u.getY(i) * sv); return geo; };
  const tint = (geo, hex) => {   // culoare pe vârfuri, pentru containere
    const c = new THREE.Color(hex), n = geo.attributes.position.count, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3);
    geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
    return geo;
  };
  function merge(geos) {
    let n = 0, ni = 0;
    geos.forEach(g => { n += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; });
    const P = new Float32Array(n * 3), N = new Float32Array(n * 3), U = new Float32Array(n * 2), I = new Uint32Array(ni);
    const hasC = geos.some(g => g.attributes.color), Cl = hasC ? new Float32Array(n * 3) : null;
    let o = 0, oi = 0;
    geos.forEach(g => {
      const c = g.attributes.position.count;
      P.set(g.attributes.position.array, o * 3);
      N.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) U.set(g.attributes.uv.array, o * 2);
      if (Cl) { if (g.attributes.color) Cl.set(g.attributes.color.array, o * 3); else Cl.fill(1, o * 3, (o + c) * 3); }
      if (g.index) for (let i = 0; i < g.index.count; i++) I[oi++] = g.index.array[i] + o;
      else for (let i = 0; i < c; i++) I[oi++] = o + i;
      o += c;
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(U, 2));
    if (Cl) g.setAttribute('color', new THREE.BufferAttribute(Cl, 3));
    g.setIndex(new THREE.BufferAttribute(I, 1));
    return g;
  }
  const lathe = (pts, seg = 20) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg);
  const ogive = (R, y0, h, n = 10, blunt = 0.04) => {   // botul: de la corp până la vârf
    const p = [];
    for (let i = 0; i <= n; i++) { const t = i / n; p.push([Math.max(R * blunt, R * Math.pow(1 - Math.pow(t, 1.8), 0.6)), y0 + t * h]); }
    return lathe(p);
  };
  const bell = (rExit, rThroat, y0, h) => lathe([[rExit, y0], [rExit * 0.82, y0 + h * 0.35], [rThroat * 1.05, y0 + h * 0.8], [rThroat, y0 + h]], 18);
  // direcția radială: θ = 0 e +z (spinarea), θ = 90° e +x
  const rotFor = th => th - PI / 2;

    const s = new THREE.Shape();
    s.moveTo(0, yTop); s.lineTo(span, yBot + (yTop - yBot) * 0.15); s.lineTo(span, yBot - drop); s.lineTo(0, yBot); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false });
    T(g, rRoot - 0.25, 0, -thick / 2);
    return T(g, 0, 0, 0, 0, rotFor(th), 0);
  }
  const radial = (th, r) => [Math.sin(th) * r, Math.cos(th) * r];

  // ---------- texturi ----------
  const R0 = rng(2100);
  const hullTex = canvasTex(512, 512, (g, w, h) => {   // tablă albă murdară: cusături, nituri, petice sudate, rugină
    g.fillStyle = '#d4cfc2'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${70 + R0() * 40},${60 + R0() * 30},${45},${R0() * 0.12})`; g.fillRect(R0() * w, R0() * h, 1 + R0() * 3, 1 + R0() * 3); }
    for (let i = 0; i < 9; i++) {   // peticele lui Vanea
      const x = R0() * w, y = R0() * h, pw = 30 + R0() * 70, ph = 20 + R0() * 50, k = 150 + R0() * 50;
      g.fillStyle = `rgb(${k},${k - 6},${k - 16})`; g.fillRect(x, y, pw, ph);
      g.fillStyle = 'rgba(70,45,25,.75)';
      for (let q = 0; q < (pw + ph) * 2; q += 4) {
        const px = q < pw ? x + q : q < pw + ph ? x + pw : q < 2 * pw + ph ? x + 2 * pw + ph - q : x;
        const py = q < pw ? y : q < pw + ph ? y + q - pw : q < 2 * pw + ph ? y + ph : y + 2 * (pw + ph) - q;
        g.fillRect(px - 1, py - 1, 3, 3);
      }
    }
    g.strokeStyle = 'rgba(55,50,42,.55)'; g.lineWidth = 2;
    for (let y = 0; y < h; y += 64) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
      for (let x = ((y / 64) % 2) * 64; x < w; x += 128) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 64); g.stroke(); }
      g.fillStyle = 'rgba(40,36,30,.6)';
      for (let x = 4; x < w; x += 10) g.fillRect(x, y + 4, 2, 2);
    }
    for (let i = 0; i < 55; i++) {   // dâre de rugină
      const x = R0() * w, y = R0() * h, len = 30 + R0() * 120, ww = 2 + R0() * 6;
      const gr = g.createLinearGradient(0, y, 0, y + len);
      gr.addColorStop(0, `rgba(130,62,22,${0.35 + R0() * 0.35})`); gr.addColorStop(1, 'rgba(130,62,22,0)');
      g.fillStyle = gr; g.fillRect(x, y, ww, len);
    }
    g.save(); g.translate(300, 200); g.rotate(-PI / 2);
    g.font = 'bold 44px "Arial Narrow", Arial, sans-serif'; g.fillStyle = 'rgba(30,40,80,.7)'; g.fillText('S.U.M.', 0, 0);
    g.restore();
  });
  const bandTex = canvasTex(8, 96, (g, w, h) => {   // banda tricoloră: albastru, galben, roșu, pe lungimea navei
    [['#1f4c9e', 0], ['#e5be1c', 1], ['#c3241d', 2]].forEach(([c, i]) => { g.fillStyle = c; g.fillRect(0, i * h / 3, w, h / 3); });
  });
  bandTex.wrapT = THREE.ClampToEdgeWrapping;
  const gaugeTex = canvasTex(256, 96, (g, w, h) => {   // bordul: ceasuri cu ac, ca la camaz
    g.fillStyle = '#16140f'; g.fillRect(0, 0, w, h);
    [[40, 48, 30], [110, 50, 34], [180, 48, 30], [232, 30, 14], [232, 70, 14]].forEach(([x, y, r], i) => {
      g.fillStyle = '#e8dcbc'; g.beginPath(); g.arc(x, y, r, 0, 2 * PI); g.fill();
      g.strokeStyle = '#222'; g.lineWidth = 2;
      for (let k = 0; k < 9; k++) { const a = PI * 0.8 + k * PI * 1.4 / 8; g.beginPath(); g.moveTo(x + Math.cos(a) * r * 0.75, y + Math.sin(a) * r * 0.75); g.lineTo(x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.92); g.stroke(); }
      const a = i === 1 ? PI * 0.82 : PI * (1 + i * 0.37);   // benzina aproape de zero
      g.strokeStyle = '#c0281c'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 0.85, y + Math.sin(a) * r * 0.85); g.stroke();
    });
    g.fillStyle = '#ff5a3a'; g.fillRect(150, 84, 8, 6); g.fillStyle = '#7dff8a'; g.fillRect(164, 84, 8, 6);
  });
  function plumeTex(c0, c1) {   // fără repetare, altfel capătul se aprinde ca un inel
    const t = canvasTex(4, 256, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, c0); gr.addColorStop(0.2, c1); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    });
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    return t;
  }

  // ---------- materiale (comune tuturor navelor) ----------
  const std = o => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.7, metalness: 0.3 }, o));
  const hullMats = [0xd8d2c4, 0xaea78a, 0x9ea6a8, 0xc8b99a, 0x8e9386].map(c => std({ color: c, map: hullTex, roughness: 0.78, metalness: 0.22 }));
  const M = {
    red: std({ color: 0xa82a1e, map: hullTex, roughness: 0.6 }),
    dark: std({ color: 0x3b3b3a, roughness: 0.55, metalness: 0.6, side: THREE.DoubleSide }),
    black: std({ color: 0x171716, roughness: 0.8, metalness: 0.2 }),
    glass: std({ color: 0x14171a, emissive: 0xffb565, emissiveIntensity: 0.85, roughness: 0.2, metalness: 0.1 }),
    band: std({ map: bandTex, roughness: 0.6, metalness: 0.2 }),
    gauge: new THREE.MeshBasicMaterial({ map: gaugeTex }),
    propane: std({ color: 0xc8261c, roughness: 0.4, metalness: 0.3 }),
    crate: std({ vertexColors: true, map: hullTex, roughness: 0.8, metalness: 0.2 }),
    flameA: new THREE.MeshBasicMaterial({ map: plumeTex('rgba(255,248,215,1)', 'rgba(255,190,90,.8)'), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
    flameB: new THREE.MeshBasicMaterial({ map: plumeTex('rgba(255,165,70,1)', 'rgba(210,70,20,.5)'), transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
    glow: new THREE.SpriteMaterial({ map: glowTex, color: 0xffb060, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }),
  };

  // flacăra: benzină și gaz, portocalie, murdară. Geometria unitară, scalată pe motor.
  const flameGeoA = new THREE.CylinderGeometry(0.72, 0.28, 0.55, 16, 1, true).translate(0, -0.275, 0);
  const flameGeoB = new THREE.CylinderGeometry(0.95, 1.7, 1, 16, 1, true).translate(0, -0.5, 0);
  function makeFlame(y, engines) {   // engines: [{x, z, r, L}]; originea la gura ajutajelor, flacăra spre -y
    const f = new THREE.Group();
    f.position.y = y;
    engines.forEach(e => {
      const inner = new THREE.Group();
      inner.position.set(e.x, 0, e.z);
      inner.scale.set(e.r, e.L, e.r);
      inner.add(new THREE.Mesh(flameGeoA, M.flameA), new THREE.Mesh(flameGeoB, M.flameB));
      f.add(inner);
      const sp = new THREE.Sprite(M.glow);
      sp.position.set(e.x, -e.r * 0.5, e.z);
      sp.scale.setScalar(e.r * 5);
      f.add(sp);
    });
    return f;
  }
  // ochii pilotului: ancoră nerotită, privește pe +y local, sus = +z local (core aplică el corecția camerei).
  // Pentru trăgător (back): rotită cu PI în jurul lui z, deci privește înapoi, sus tot pe +z.
  function camMount(x, y, z, back) {
    const o = new THREE.Object3D();
    o.position.set(x, y, z);
    if (back) o.rotation.z = PI;
    return o;
  }
  const add = (grp, geo, mat) => { const m = new THREE.Mesh(geo, mat); grp.add(m); return m; };
  const muzzle = (parent, x, y, z) => { const o = new THREE.Object3D(); o.position.set(x, y, z); parent.add(o); return o; };

  // ---------- racheta lui Lionea: 32 m, cu „sistema pentru gaz” ----------
  function makeRacheta() {
    const g = new THREE.Group(), R = 3.2;
    const hull = [], red = [], dark = [], glass = [];
    hull.push(uvs(new THREE.CylinderGeometry(R, R, 17, 32, 1, true).translate(0, -0.5, 0), 2, 2.2));
    hull.push(uvs(new THREE.CylinderGeometry(R, 3.9, 3.5, 32, 1, true).translate(0, -10.75, 0), 2, 0.5));
    hull.push(new THREE.CircleGeometry(3.9, 32).rotateX(PI / 2).translate(0, -12.5, 0));
    red.push(ogive(R, 8, 8));
    dark.push(bell(2.5, 1.4, -16, 3.5));
    [PI / 4, 3 * PI / 4, 5 * PI / 4, 7 * PI / 4].forEach(th => hull.push(fin(th, R, -4, -12, 4.4, 3.5, 0.35)));
    for (let i = 0; i < 6; i++) {   // petice sudate în relief
      const th = R0() * 2 * PI, y = -8 + R0() * 15, [x, z] = radial(th, R + 0.04);
      hull.push(T(new THREE.BoxGeometry(1 + R0() * 1.6, 0.8 + R0() * 1.4, 0.08), x, y, z, 0, th, 0));
    }
    // parbrizul pe spinare și hublourile din jurul botului
    glass.push(new THREE.CylinderGeometry(R + 0.03, R + 0.03, 1.6, 24, 1, true, -0.85, 1.7).translate(0, 9, 0));
    for (let k = 0; k < 8; k++) {
      const th = PI / 2 + k * PI / 8 + PI / 16, [x, z] = radial(th, R);
      glass.push(new THREE.CylinderGeometry(0.42, 0.42, 0.25, 14).rotateX(PI / 2).rotateY(th).translate(x, 5.6, z));
    }
    add(g, merge([uvs(new THREE.CylinderGeometry(R + 0.06, R + 0.06, 2.4, 32, 1, true), 1, 1).translate(0, 4.2, 0)]), M.band);
    // „sistema pentru gaz”: butelia roșie de propan legată pe flanc, cu furtun spre motor
    const bx = R + 1.0;
    red.push(lathe([[0.01, -1.7], [0.6, -1.65], [0.9, -1.4], [0.92, 1.2], [0.75, 1.55], [0.3, 1.75], [0.01, 1.8]], 18).translate(bx, -2, 0));
    [-2.9, -1.1].forEach(y => dark.push(new THREE.TorusGeometry(0.98, 0.09, 6, 24).rotateX(PI / 2).translate(bx, y, 0)));
    [-2.9, -1.1].forEach(y => dark.push(new THREE.BoxGeometry(1.1, 0.16, 0.5).translate(R + 0.3, y, 0)));
    dark.push(new THREE.CylinderGeometry(0.12, 0.12, 0.5, 8).translate(bx, 0.05, 0));
    dark.push(new THREE.TorusGeometry(0.3, 0.05, 6, 16).translate(bx, 0.35, 0));
    dark.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(bx, 0.3, 0), V(bx + 0.6, -1, 0.3), V(bx + 0.4, -6, 0.5), V(R + 0.2, -10, 0.4)]), 24, 0.09, 6));
    // difuzoarele externe: două pâlnii spre înainte, lângă bot
    [-0.6, 0.6].forEach(th => {
      const [x, z] = radial(th, R + 0.6);
      dark.push(new THREE.CylinderGeometry(0.75, 0.18, 1.4, 14, 1, true).translate(x, 6.6, z));
      dark.push(new THREE.CylinderGeometry(0.2, 0.2, 0.6, 8).rotateX(PI / 2).translate(x * 0.92, 6.0, z * 0.92));
    });
    dark.push(new THREE.CylinderGeometry(0.05, 0.05, 6, 6).rotateX(PI / 2).translate(1.8, -1, R + 2.6));   // antena
    // rachetele lui Vova, pe flancul stâng
    const missiles = [];
    [-0.8, 0.8].forEach(z => {
      dark.push(new THREE.BoxGeometry(0.5, 4, 0.3).translate(-R - 0.2, 1.5, z));
      hull.push(uvs(new THREE.CylinderGeometry(0.38, 0.38, 4.8, 12).translate(-R - 0.6, 1.3, z), 0.3, 0.4));
      red.push(new THREE.ConeGeometry(0.38, 1.2, 12).translate(-R - 0.6, 4.3, z));
      missiles.push(muzzle(g, -R - 0.6, 1.3, z));
    });
    add(g, merge(hull), hullMats[0]);
    add(g, merge(red), M.red);
    add(g, merge(dark), M.dark);
    add(g, merge(glass), M.glass);

    // cabina: bordul cu ceasuri și volanul („încleștat în ruli”)
    add(g, new THREE.BoxGeometry(3.2, 0.7, 0.8).translate(0, 11.6, 0.55), M.black);
    add(g, new THREE.PlaneGeometry(3.0, 0.7).rotateX(PI / 2).translate(0, 11.24, 0.55), M.gauge);
    add(g, merge([new THREE.TorusGeometry(0.32, 0.04, 8, 28).rotateX(PI / 2).translate(-0.55, 10.6, 0.95),
      new THREE.CylinderGeometry(0.04, 0.04, 0.75, 6).translate(-0.55, 10.95, 0.95),
      new THREE.BoxGeometry(0.05, 0.05, 0.64).translate(-0.55, 10.6, 0.95)]), M.black);
    const cockpit = camMount(-0.55, 9.2, 1.65);
    g.add(cockpit);

    // turela lui Vova: pe spinare, spre coadă, cu „puștile” îndreptate înapoi
    const turret = new THREE.Group();
    turret.position.set(0, -5, R);
    g.add(turret);
    add(turret, merge([new THREE.CylinderGeometry(1.4, 1.5, 0.6, 20).rotateX(PI / 2).translate(0, 0, 0.3),
      new THREE.SphereGeometry(1.15, 18, 10, 0, 2 * PI, 0, PI / 2).rotateX(PI / 2).translate(0, 0, 0.55)]), hullMats[0]);
    add(turret, merge([-0.45, 0.45].map(x => new THREE.CylinderGeometry(0.16, 0.2, 4.4, 8).translate(x, -2.4, 1.45)).concat(
      [new THREE.BoxGeometry(1.6, 1, 0.8).translate(0, -0.4, 1.3)])), M.dark);
    add(turret, new THREE.CylinderGeometry(0.5, 0.5, 0.06, 12, 1, false, -1.2, 2.4).rotateX(PI / 2).translate(0, 0.25, 1.35), M.glass);
    const muzzles = [muzzle(turret, -0.45, -4.7, 1.45), muzzle(turret, 0.45, -4.7, 1.45)];
    const gunner = camMount(0, 0.9, 1.95, true);
    turret.add(gunner);

    const flame = makeFlame(-16, [{ x: 0, z: 0, r: 2.3, L: 22 }]);
    g.add(flame);
    g.userData = { len: 32, flame, cockpit, gunner, muzzles, turret, missiles };
    return g;
  }

  // ---------- navele de război ale bazei: 24–45 m, fiecare altfel, unele epave peticite ----------
  function makeWarship(seed) {
    const r = rng(seed * 7919 + 13), g = new THREE.Group();
    const L = 24 + r() * 21, R = L * (0.085 + r() * 0.03), wreck = r() < 0.4;
    const y0 = -L / 2, yB = y0 + L * 0.1, yS = yB + L * 0.08, yN = yS + L * (0.5 + r() * 0.08), hN = L / 2 - yN;
    const skirtR = R * (1.1 + r() * 0.15), mat = hullMats[(r() * hullMats.length) | 0];
    const hull = [], dark = [], nose = [], glass = [];
    hull.push(uvs(new THREE.CylinderGeometry(R, R, yN - yS, 24, 1, true).translate(0, (yN + yS) / 2, 0), 2, (yN - yS) / 9));
    hull.push(uvs(new THREE.CylinderGeometry(R, skirtR, yS - yB, 24, 1, true).translate(0, (yS + yB) / 2, 0), 2, 0.4));
    hull.push(new THREE.CircleGeometry(skirtR, 24).rotateX(PI / 2).translate(0, yB, 0));
    const noseKind = r();
    nose.push(noseKind < 0.5 ? ogive(R, yN, hN) : noseKind < 0.8 ? lathe([[R, yN], [R * 0.08, yN + hN], [0.01, yN + hN]], 20) : ogive(R, yN, hN * 0.6, 8, 0.35));
    dark.push(bell(skirtR * 0.7, R * 0.4, y0, yB - y0));
    const nf = r() < 0.5 ? 3 : 4, span = R * (1 + r() * 0.8), off = nf === 3 ? PI : PI / 4;
    for (let k = 0; k < nf; k++) {
      if (wreck && k === 1 && r() < 0.5) continue;   // aripioara pierdută într-o luptă veche
      hull.push(fin(off + k * 2 * PI / nf, R, yS + L * 0.12, yB, span, L * 0.07, Math.max(0.25, R * 0.1)));
    }
    const nPatch = wreck ? 7 : 2;
    for (let i = 0; i < nPatch; i++) {
      const th = r() * 2 * PI, y = yS + r() * (yN - yS), [x, z] = radial(th, R + 0.04);
      (wreck && i % 2 ? dark : hull).push(T(new THREE.BoxGeometry(1 + r() * R, 0.8 + r() * R, 0.08), x, y, z, 0, th, 0));
    }
    glass.push(new THREE.CylinderGeometry(R + 0.03, R + 0.03, L * 0.04, 20, 1, true, -0.7, 1.4).translate(0, yN - L * 0.03, 0));
    // armele: tunuri pe flancuri, spre înainte; jumătate au și o turelă pe spinare
    const muzzles = [], gy = yS + (yN - yS) * 0.55, gl = L * 0.22;
    [-1, 1].forEach(s => {
      hull.push(new THREE.BoxGeometry(R * 0.5, gl * 0.7, R * 0.5).translate(s * (R + R * 0.2), gy, 0));
      dark.push(new THREE.CylinderGeometry(R * 0.08, R * 0.1, gl, 8).translate(s * (R + R * 0.2), gy + gl * 0.5, 0));
      muzzles.push(muzzle(g, s * (R + R * 0.2), gy + gl, 0));
    });
    if (r() < 0.5) {
      const ty = yS + (yN - yS) * 0.25;
      hull.push(new THREE.SphereGeometry(R * 0.45, 14, 8, 0, 2 * PI, 0, PI / 2).rotateX(PI / 2).translate(0, ty, R * 0.95));
      [-1, 1].forEach(s => {
        dark.push(new THREE.CylinderGeometry(R * 0.06, R * 0.06, gl * 0.8, 6).translate(s * R * 0.15, ty + gl * 0.4, R * 1.2));
        muzzles.push(muzzle(g, s * R * 0.15, ty + gl * 0.8, R * 1.2));
      });
    }
    add(g, merge(hull), mat);
    add(g, merge(dark), M.dark);
    add(g, merge(nose), r() < 0.6 ? M.red : mat);
    add(g, merge(glass), M.glass);
    add(g, uvs(new THREE.CylinderGeometry(R + 0.05, R + 0.05, L * 0.07, 24, 1, true), 1, 1).translate(0, yS + (yN - yS) * 0.8, 0), M.band);
    const flame = makeFlame(y0, [{ x: 0, z: 0, r: skirtR * 0.65, L: L * 0.6 }]);
    g.add(flame);
    const cockpit = camMount(0, yN - L * 0.03, R * 0.55);
    g.add(cockpit);
    g.userData = { len: L, flame, cockpit, muzzles, wreck };
    return g;
  }

  // ---------- transportoarele: corp gros, două motoare, containere legate pe flancuri ----------
  function makeTransport(seed) {
    const r = rng(seed * 104729 + 7), g = new THREE.Group();
    const L = 32 + r() * 8, R = 5.2 + r() * 1.3, y0 = -L / 2, yBody = y0 + 7, yTop = L / 2 - R * 0.7;
    const mat = hullMats[(r() * hullMats.length) | 0];
    const hull = [], dark = [], glass = [], crates = [];
    hull.push(uvs(new THREE.CylinderGeometry(R, R, yTop - yBody, 28, 1, true).translate(0, (yTop + yBody) / 2, 0), 3, (yTop - yBody) / 8));
    hull.push(new THREE.SphereGeometry(R, 28, 12, 0, 2 * PI, 0, PI / 2).scale(1, 0.7, 1).translate(0, yTop, 0));
    hull.push(new THREE.CylinderGeometry(R, R * 0.8, 2, 28).translate(0, yBody - 1, 0));
    const ex = R * 0.55;
    [-1, 1].forEach(s => {   // nacelele motoarelor, una lângă alta
      hull.push(uvs(new THREE.CylinderGeometry(1.7, 1.9, 6, 16).translate(s * ex, y0 + 4, 0), 1, 0.5));
      dark.push(bell(2.0, 1.0, y0, 2.4).translate(s * ex, 0, 0));
      dark.push(new THREE.BoxGeometry(0.6, 4, R * 0.8).translate(s * ex * 0.5, y0 + 5, 0));
    });
    // containerele: portocaliu, albastru, verde, ruginite, cu chingi
    const cols = [0xc66a22, 0x2f5b8c, 0x4f6b3a, 0x9c3a26, 0xb59a3a];
    const nc = 4 + ((r() * 3) | 0);
    for (let i = 0; i < nc; i++) {
      const th = (i / nc) * 2 * PI + 0.3, [x, z] = radial(th, R + 1.35), y = yBody + 3 + r() * (yTop - yBody - 12);
      const cg = uvs(new THREE.BoxGeometry(2.6, 6.1, 2.6), 0.6, 1.2);
      crates.push(tint(T(cg, x, y + 3, z, 0, th, 0), cols[(r() * cols.length) | 0]));
      [-1.6, 1.6].forEach(dy => dark.push(T(new THREE.TorusGeometry(R + 0.1, 0.1, 4, 36).rotateX(PI / 2), 0, y + 3 + dy, 0)));
    }
    glass.push(new THREE.CylinderGeometry(R + 0.03, R + 0.03, 1.2, 24, 1, true, -0.6, 1.2).translate(0, yTop - 0.4, 0));
    add(g, merge(hull), mat);
    add(g, merge(dark), M.dark);
    add(g, merge(glass), M.glass);
    add(g, merge(crates), M.crate);
    add(g, uvs(new THREE.CylinderGeometry(R + 0.06, R + 0.06, 2.6, 28, 1, true), 1, 1).translate(0, yTop - 3.5, 0), M.band);
    const flame = makeFlame(y0, [-1, 1].map(s => ({ x: s * ex, z: 0, r: 1.8, L: 16 })));
    g.add(flame);
    const cockpit = camMount(0, yTop + R * 0.2, R * 0.55);
    g.add(cockpit);
    g.userData = { len: L, flame, cockpit, muzzles: [] };
    return g;
  }

  return { makeRacheta, makeWarship, makeTransport };
}

<script>
// ---- mod-lupta.js ----
// ---------- Lupta: cine unde e, cine trage și cine cade, în fiecare clipă ----------
// Totul e funcție pură de timp: aceeași secundă arată la fel, fie că o atingi jucând, fie derulând înapoi.
// Cronologia urmează episodul 1, rândurile 124-692, cu navele de pe Titan din episodul 2.
function modLupta(ctx) {
  const { THREE, scene, rng, V3, terrainH, hashN, smooth, FX, flota, baza, pam, EARTH_DIR } = ctx;
  const T_END = 330;
  const UPW = V3(0, 1, 0);
  const R = rng(424242);
  const G_MOON = 1.62;

  // ---------- unelte ----------
  function hermite(out, p0, m0, p1, m1, s, T) {
    const s2 = s * s, s3 = s2 * s;
    const h00 = 2 * s3 - 3 * s2 + 1, h10 = s3 - 2 * s2 + s, h01 = -2 * s3 + 3 * s2, h11 = s3 - s2;

      if (t >= L.td) {
        L.fall.pos(t, uP);
        const tau = Math.min(t, L.fall.tImpact) - L.td;
        uQ.copy(L.qd).multiply(spinQ.setFromAxisAngle(L.fall.axis, L.fall.spin * tau));
      } else if (t < L.tB) {
        lamaPos(L, t, uP);
        uQ.copy(L.qA);
        if (t < L.launch) dockWorld(L, t, uP, uQ);
      } else if (L === dragos && t > 309) {
        lamaPos(L, t, uP);
        velQuat((tt, o) => lamaPos(L, tt, o), 309, uQ, V3(1, 0, 0), true);
        uQ.slerp(basisX(V3(0, 0, -1), UPW, spinQ), smooth(309, 316, t));
      } else {
        lamaPos(L, t, uP);
        velQuat((tt, o) => lamaPos(L, tt, o), t, uQ, V3(1, 0, 0), true, 1);
        if (t < L.tB + 2) uQ.slerp(L.qA, 1 - smooth(L.tB, L.tB + 2, t));
      }
      uM.compose(uP, uQ, ONE);
      lamaMesh.setMatrixAt(L.idx, uM);
      const cx = t - L.launch;
      if (cx > 0.5 && cx < 4.5 && t < L.td) {
        crossMesh.setMatrixAt(L.idx, uM);
        const k = Math.sin(Math.PI * (cx - 0.5) / 4);
        crossMesh.setColorAt(L.idx, cCol.setRGB(k, k * 0.9, k * 0.75));
      } else crossMesh.setMatrixAt(L.idx, ZERO);
      const an = lamaAnchors.get(L);
      if (an) { an.o.position.copy(uP); an.o.quaternion.copy(uQ); }
    }
    lamaMesh.instanceMatrix.needsUpdate = true;
    crossMesh.instanceMatrix.needsUpdate = true;
    if (crossMesh.instanceColor) crossMesh.instanceColor.needsUpdate = true;
    // racheta lui Lionea
    rocketPos(t, rocket.position);
    velQuat(rocketPos, t, rocket.quaternion, rocketFall, false, 1);
    let thr = t < 100.8 ? 0 : motion.speed > 4 ? Math.min(1.3, 0.55 + Math.max(0, motion.aF) / 40) : 0;
    if (t > 255 && t < 262) thr *= hashN((t * 12) | 0, 9) > 0.45 ? 1 : 0.1;   // „Gaz tot nu-i!”
    setFlame(rocket, thr);
    rocket.visible = rocket.position.lengthSq() < 4e8;
    // pământenii
    for (const s of SUM) {
      if (t >= s.td) {
        s.fall.pos(t, s.o.position);
        const tau = Math.min(t, s.fall.tImpact) - s.td;
        s.o.quaternion.copy(s.qd).multiply(spinQ.setFromAxisAngle(s.fall.axis, s.fall.spin * 0.6 * tau));
        setFlame(s.o, 0);
      } else {
        s.track(t, s.o.position);
        velQuat(s.track, t, s.o.quaternion, s.park, false, 0.8);
        setFlame(s.o, t < s.te ? 0 : motion.speed > 4 ? Math.min(1.2, 0.5 + Math.max(0, motion.aF) / 40) : 0.2);
      }
      s.o.visible = s.o.position.lengthSq() < 4e8;
    }
  }

  // ---------- capitolele, cu versurile din episodul 1 ----------
  const chapters = [
    { t: 0, title: 'Liniștea', ref: 'ep. 1, rândurile 124–127', verse: `Lionea sta privind la stele,\nObosit să presupună,\nAștepta întrevederea\nÎn angarul de pe lună.`,
      what: 'Racheta lui Lionea stă în hangarul lateral. Flota vine dinspre Marte: două puncte pe cer, la 32 km, care frânează.' },
    { t: 22, title: 'Prima lovitură', ref: 'ep. 1, rândurile 344–347', verse: `"Înțeleg..." Și-n clipa asta\nO explozie uriașă\nZgâlțâi din temelie\nDe construcția trufașă.`,
      what: 'Clopotul trage din orbită în cupolă: o bară de fier de 20 t la 30 km/s. Primarul moare sub coloană.' },
    { t: 34, title: 'Lamele pleacă', ref: 'ep. 1, rândurile 454–457', verse: `Cât putea cuprinde ochiul,\nUnde-și aruncau privirea,\nPeste tot erau doar nave\nCare le urzeau pieirea.`,
      what: 'Din fiecare dreadnought se desprind 96 de Lame, cu crucea de lumină pe burtă. La 0:44 crucișătoarele se desprind de Brâu.' },
    { t: 60, title: 'Hienele de la intrare', ref: 'ep. 1, rândurile 489–492', verse: `Navele mai ușurele\nSe grupară la intrare,\nNelăsând nici cea mai mică\nȘansă de evacuare.`,

    { t: 95, title: 'Zidul cade', ref: 'ep. 1, rândurile 446–449', verse: `O explozie uriașă\nRidicând de colb un nor,\nDizolvă cu ușurință\nDin perete o bucată,`,
      what: 'Peretele hangarului lateral sare în bucăți. Trei, doi, unu și pedala.' },
    { t: 101, title: 'Ieșirea', ref: 'ep. 1, rândurile 509–512', verse: `Sprintenă și grațioasă\nNava o zbughi afară,\nCa în următoarea clipă\nS-o străbată o rafală,`,
      what: 'Două Lame ciuruie racheta. Vanea sudează găurile din mers.' },
    { t: 106, title: 'Goana', ref: 'ep. 1, rândurile 519–522', verse: `Trei navete inamice\nSe desprinseră din gloată\nŞi-ncăpăţânat porniră\nGoana după ei îndată.`,
      what: 'Stiopa duce racheta la 60 de metri deasupra colbului, ca pe un camaz.' },
    { t: 119, title: 'Prima', ref: 'ep. 1, rândurile 534–537', verse: `Ciurui cu o rafală\nŞi în urma presiunii,\nUna din nave cu vuiet\nExplodă în colbul lunii.` },
    { t: 124.5, title: 'Două rachete', ref: 'ep. 1, rândurile 539–542', verse: `"Vova, dă două rachete\nÎnspre cea din dreapta navă!"\nVova reperă marcajul\nŞi o transformă-n epavă.` },
    { t: 135, title: 'Stânca', ref: 'ep. 1, rândurile 549–552', verse: `Și viclean, pândind momentul,\nTrase înspre el volanul,\nNava ocolind o stâncă,\nSprinten amăgi dușmanul.` },
    { t: 150, title: 'Baza, baza', ref: 'ep. 1, rândurile 564–567', verse: `"Baza, baza, asta-i Lionea!"\n"Lionea?! Care Lionea, uăi?!"\n"Gura! Fără multă vorbă!\nDacă să trăiești mai vrei,`,
      what: 'Lionea dă planul: navele de război ies primele, transportoarele duc răniții.' },
    { t: 162, title: 'Cuirasatul', ref: 'ep. 1, rândurile 599–602', verse: `Şi zări cuirasatul,\nCe-n a luptei fierbinţeală\nSe desprinse de la grupă,\nFiind ţinta ideală.`,
      what: 'Crucișătorul 1 al primului dreadnought a coborât spre poartă, departe de ai lui. În stoc e o bombă nucleară.' },
    { t: 176, title: 'Încă un soare', ref: 'ep. 1, rândurile 614–617', verse: `Pentru un moment în spaţiu\nApăru încă un soare,\nNava greu lovită-n coastă\nÎncepu lent, să coboare.` },
    { t: 193, title: 'Baza, gazu!', ref: 'ep. 1, rândurile 624–627', verse: `"Baza, gazu! Baza, gazu!"\nUrlând, dădu start furtunii,\nCând răpus leviathanul\nSe tufli în colbul lunii...` },
    { t: 198, title: 'Liliecii', ref: 'ep. 1, rândurile 629–632', verse: `Semănau cu liliecii\nDin a peşterii răcoare,\nCând stârniţi pornesc în stoluri\nAvântându-se spre soare.`,
      what: '24 de nave de război ies din tunel. Lamele fac un pas înapoi. De la 3:20, transportoarele pleacă spre Pământ.' },
    { t: 214, title: 'Regruparea', ref: 'ep. 1, rândurile 639–642', verse: `Dar treptat, scăpat de şocul\nLoviturii fără veste,\nRegrupă a sale forţe,\nConcentrând atacul peste` },
    { t: 255, title: 'N-am patroane', ref: 'ep. 1, rândurile 654–657', verse: `"Căpitane, n-am patroane!" -\nVova îi urlă în cască.\nStiopa-i arătă săgeata,\nGata să se prăbuşească,` },
    { t: 262, title: 'Retragerea', ref: 'ep. 1, rândurile 669–672', verse: `"Ultima aeronavă\nE pe drum înspre pământ!"\n"Bun! Retragerea acuma!\nHai, băieţi, înc-un avânt!"...`,
      what: 'Cele 7 nave de război rămase și racheta lui Lionea pleacă spre Pământ.' },
    { t: 280, title: 'Luna captivă', ref: 'ep. 1, rândurile 689–692', verse: `Dar necunoscuta flotă\nRenunţă la ofensivă,\nRetrăgându-se pe luna\nCe-o avea deja captivă...`,
      what: 'Lamele trec în formație, un inel liniștit deasupra bazei.' },
    { t: 300, title: 'Aselenizarea', ref: 'ep. 2, rândurile 26–29', verse: `Câteva minute-n urmă\nPe al lunii relief\nAseleniză la ordin\nCalm, supus dar fără chef`,

  const domeTop = V3(70, terrainH(70, -380) + 70, -380);
  const views = [
    { id: 'panorama', name: 'Panorama', type: 'orbit', point: V3(0, 800, 900), dir: V3(-0.42, 0.1, 1), dist: 7200 },

    { id: 'liber', name: 'Zbor liber', type: 'free' },
  ];

  return { T_END, chapters, views, entities, update };
}

  }

  // ---------- bucla ----------
  const startView = L.views.find(v => v.id === (Q.get('view') || 'panorama')) || L.views[0];
  setView(startView, viewBtns[L.views.indexOf(startView)]);
  if (Q.has('cam')) setView({ type: 'free', pos: V3(...Q.get('cam').split(',').map(Number)), look: V3(...Q.get('look').split(',').map(Number)) }, null);
  syncPlay();
  $('status').hidden = true;
  let last = performance.now(), followTick = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (playing) {
      t += dt * speed;
      if (t >= T_END) { t = T_END; playing = false; syncPlay(); }
    }
    L.update(t);
    ctx.baza.update(t);
    updateCamera(dt);
    FX.update(t, camera.position);
    renderer.toneMappingExposure = FX.exposure;
    $('scrub').value = t;
    $('clock').textContent = `${fmt(t)} / ${fmt(T_END)}`;
    syncChapter();
    if ((followTick += dt) > 0.5) { followTick = 0; syncFollow(); }
    updateTags();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
